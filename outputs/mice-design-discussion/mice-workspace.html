<script>
(()=>{
 const root=document.getElementById('mice-workspace'), main=root.querySelector('#mc-main'), notice=root.querySelector('#mc-notice');
 const projects=[{id:'P1',name:'华康医药 · 2026年度会议服务',customer:'华康医药有限公司',type:'年度多场',status:'进行中',sales:'林晓',manager:'陈敏',contract:'框架合同 HK-2026-01',amount:5000000,amountLabel:'年度合同上限',note:'具体活动以客户确认单为准',team:[['林晓','客户约定、收款及开票申请'],['陈敏','项目统筹、活动分配'],['赵悦','上海场次执行'],['周宁','杭州场次执行'],['王珊','资源采购支持'],['刘晴','活动资料与名单']]},{id:'P2',name:'远航科技 · 秋季品牌发布会',customer:'远航科技有限公司',type:'整包项目',status:'准备中',sales:'林晓',manager:'陈敏',contract:'服务合同 YH-2026-09',amount:180000,amountLabel:'整包客户确认金额',note:'整包委托，客户价款未按活动拆分',team:[['林晓','客户约定与结算'],['陈敏','项目统筹'],['赵悦','主会场执行'],['王珊','搭建及设备采购']]}];
 const initialActivities=[{id:'A1',project:'P1',name:'上海医学交流会',date:'2026-10-18',city:'上海',people:60,owner:'赵悦',status:'准备中',confirmed:50000,cost:40000,received:20000,accepted:'待验收',venue:'上海浦江会议酒店 · 明珠厅',customerDoc:'活动确认单 HK-1018',service:'半日会议、会场、餐饮与住宿',hotel:28000,paid:8000,pending:4000},{id:'A2',project:'P1',name:'杭州专家研讨会',date:'2026-10-05',city:'杭州',people:40,owner:'周宁',status:'已完成',confirmed:36000,cost:28500,received:24000,accepted:'已验收 · 10月6日',venue:'杭州西湖会议中心 · 文澜厅',customerDoc:'活动确认单 HK-1005',service:'一日研讨会、茶歇与专家接送',hotel:20000,paid:20000,pending:0},{id:'A3',project:'P2',name:'发布会主场',date:'2026-10-28',city:'北京',people:200,owner:'赵悦',status:'准备中',confirmed:null,cost:108000,received:null,accepted:'待验收',venue:'北京星河艺术中心 · 主厅',customerDoc:'服务合同 YH-2026-09',service:'发布会、设备搭建、会务与接待',hotel:68000,paid:20000,pending:0}];
 const defaultState={version:1,revision:0,screen:'project',projectId:'P1',activityId:'A1',projectTab:'活动安排',activityTab:'执行安排',returnScreen:'project',month:'全部月份',owner:'全部负责人',activities:initialActivities,requests:[],density:'标准'};
 function restore(saved){const v=saved?.privateContent;if(!v||v.version!==1||!Array.isArray(v.activities))return structuredClone(defaultState);return {...structuredClone(defaultState),...v,screen:['projects','project','activities','activity'].includes(v.screen)?v.screen:'project',activities:v.activities.filter(a=>a&&typeof a.id==='string'&&projects.some(p=>p.id===a.project)).slice(0,30)};}
 let state=restore(window.openai?.widgetState), side=null, selected=new Set(), batchCount=2;
 const money=n=>n===null||n===undefined?'未分场':new Intl.NumberFormat('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const project=()=>projects.find(p=>p.id===state.projectId)||projects[0];
 const activity=()=>state.activities.find(a=>a.id===state.activityId)||state.activities[0];
 const btn=(label,action,kind='',attrs='')=>`<button type="${action==='submit-payment'?'submit':'button'}" class="mc-${kind==='link'?'link':'action'} ${kind==='primary'?'mc-primary':''} cursor-interaction" data-action="${action}" ${attrs.replace('type="submit"','')}>${label}</button>`;
 const tag=s=>`<span class="mc-state ${s==='已完成'?'done':s==='草稿'?'draft':''}">${esc(s)}</span>`;
 const facts=items=>`<dl class="mc-facts">${items.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
 function save(){state.revision+=1;const snapshot=JSON.parse(JSON.stringify(state));window.openai?.setWidgetState?.({modelContent:{页面:state.screen,项目:project().name,活动:state.screen==='activity'?activity()?.name:null,已提交付款申请:state.requests.map(r=>({活动:state.activities.find(a=>a.id===r.activity)?.name,金额:r.amount,状态:'审批中'}))},privateContent:snapshot})?.catch(()=>{});}
 function tell(s){notice.textContent=s;notice.classList.add('is-visible');}
 function navigate(screen){state.screen=screen;side=null;selected.clear();notice.classList.remove('is-visible');render();save();}
 function pageHead(crumb,title,subtitle,status='',back=''){return `<div class="mc-breadcrumb">${crumb}</div>${back?`<button class="mc-back cursor-interaction" data-action="${back}">← ${back==='back-projects'?'返回项目列表':state.returnScreen==='activities'?'返回活动执行':'返回项目活动'}</button>`:''}<div class="mc-page-head"><div><div class="mc-title"><h1>${esc(title)}</h1>${status?tag(status):''}</div>${subtitle?`<p class="mc-sub">${subtitle}</p>`:''}</div></div>`;}
 function tabs(list,type){const value=state[type+'Tab'];return `<div class="mc-tabs" role="tablist" aria-label="${type==='project'?'项目详情':'活动详情'}">${list.map(t=>`<button type="button" id="mc-tab-${type}-${list.indexOf(t)}" role="tab" aria-controls="mc-tab-panel" aria-selected="${value===t}" class="mc-tab cursor-interaction" data-tab="${esc(t)}" data-type="${type}">${t}</button>`).join('')}</div>`;}
 function filters(){const owners=['全部负责人','赵悦','周宁','陈敏'];const months=['全部月份',...new Set(state.activities.map(a=>a.date.slice(0,7)))];return `<div class="mc-controls"><label class="mc-control">活动月份<select data-filter="month" aria-label="活动月份">${months.map(m=>`<option ${state.month===m?'selected':''}>${m}</option>`).join('')}</select></label><label class="mc-control">负责人<select data-filter="owner" aria-label="负责人">${owners.map(o=>`<option ${state.owner===o?'selected':''}>${o}</option>`).join('')}</select></label></div>`;}
 function filtered(id){return state.activities.filter(a=>(!id||a.project===id)&&(state.month==='全部月份'||a.date.startsWith(state.month))&&(state.owner==='全部负责人'||a.owner===state.owner)).sort((a,b)=>a.date.localeCompare(b.date));}
 function activitiesTable(items,all){return `<div class="mc-table-wrap"><table class="mc-activity-table"><colgroup><col class="mc-checkcol"><col><col style="width:125px"><col style="width:68px"><col style="width:78px"><col style="width:87px"><col class="mc-operation"></colgroup><thead><tr><th><input type="checkbox" data-select-all aria-label="选择当前活动" ${items.length&&items.every(a=>selected.has(a.id))?'checked':''}></th><th>活动名称</th><th>日期 / 地点</th><th>人数</th><th>负责人</th><th>状态</th><th class="mc-operation">操作</th></tr></thead><tbody>${items.map(a=>`<tr><td><input type="checkbox" data-select="${a.id}" aria-label="选择${esc(a.name)}" ${selected.has(a.id)?'checked':''}></td><td><strong class="mc-name">${esc(a.name)}</strong><span class="mc-secondary">${all?esc(projects.find(p=>p.id===a.project)?.name):esc(a.customerDoc||'客户确认待补')}</span></td><td><span class="mc-nowrap">${esc(a.date)}</span><span class="mc-secondary">${esc(a.city||'地点待补')}</span></td><td class="mc-nowrap">${a.people||'—'}</td><td class="mc-nowrap">${esc(a.owner)}</td><td>${tag(a.status)}</td><td class="mc-operation">${btn('详情','open-activity','link',`data-id="${a.id}"`)}</td></tr>`).join('')||`<tr><td colspan="7"><div class="mc-empty">当前条件下暂无活动</div></td></tr>`}</tbody></table></div><div class="mc-list-footer">共 ${items.length} 场活动${selected.size?` · 已选择 ${selected.size} 场`:''}</div>`;}
 function projectList(){return pageHead('产品中心 / 单团项目','单团项目','')+`<section class="mc-panel mc-pad"><div class="mc-table-wrap"><table class="mc-project-table"><colgroup><col><col style="width:100px"><col style="width:130px"><col style="width:76px"><col style="width:82px"><col class="mc-operation"></colgroup><thead><tr><th>项目 / 客户</th><th>组织方式</th><th>客户约定金额</th><th>活动</th><th>状态</th><th class="mc-operation">操作</th></tr></thead><tbody>${projects.map(p=>`<tr><td><strong class="mc-name">${esc(p.name)}</strong><span class="mc-secondary">${esc(p.customer)}</span></td><td>${p.type}</td><td><span class="mc-money">${money(p.amount)}</span><span class="mc-secondary">${p.amountLabel}</span></td><td><span class="mc-nowrap">${btn(state.activities.filter(a=>a.project===p.id).length,'open-project','link',`data-id="${p.id}"`)} 场</span></td><td>${tag(p.status)}</td><td class="mc-operation">${btn('详情','open-project','link',`data-id="${p.id}"`)}</td></tr>`).join('')}</tbody></table></div><div class="mc-list-footer">共 2 个项目 · 金额单位：元</div></section>`;}
 function projectContent(){const p=project();switch(state.projectTab){case '活动安排':return `<div class="mc-toolbar">${filters()}<div class="mc-controls">${btn('批量新增','batch-add','primary')}${btn('分配负责人','assign','',selected.size?'':'disabled')}</div></div>${activitiesTable(filtered(p.id),false)}`;case '客户约定':return `${facts([['客户',esc(p.customer)],['合同依据',esc(p.contract)],[p.amountLabel,`<span class="mc-money">¥ ${money(p.amount)}</span>`],['价款约定',esc(p.note)],['收款约定',p.id==='P1'?'每场确认后付40%，月度验收后结清':'签约40%，搭建完成40%，验收20%'],['客户联系人',p.id==='P1'?'许女士 · 会议采购':'宋先生 · 品牌部']])}<div class="mc-section-title"><h3>客户委托</h3></div><div class="mc-table-wrap"><table class="mc-small-table"><colgroup><col><col style="width:125px"><col style="width:120px"></colgroup><thead><tr><th>确认依据 / 服务范围</th><th>确认金额</th><th>收款情况</th></tr></thead><tbody>${p.id==='P1'?state.activities.filter(a=>a.project===p.id&&a.confirmed!==null).map(a=>`<tr><td>${esc(a.customerDoc)}<span class="mc-secondary">${esc(a.name)}</span></td><td class="mc-money">${money(a.confirmed)}</td><td class="mc-money">已收 ${money(a.received)}</td></tr>`).join(''):`<tr><td>服务合同 YH-2026-09<span class="mc-secondary">发布会整体服务 · 未分场价款</span></td><td class="mc-money">180,000.00</td><td class="mc-money">已收 72,000.00</td></tr>`}</tbody></table></div>`;case '项目费用':return `<div class="mc-section-title"><h3>项目共同费用</h3></div><div class="mc-table-wrap"><table class="mc-small-table"><colgroup><col><col style="width:110px"><col style="width:120px"></colgroup><thead><tr><th>费用 / 供应商</th><th>含税金额</th><th>承担范围</th></tr></thead><tbody><tr><td>${p.id==='P1'?'年度会议视觉设计':'发布会整体创意策划'}<span class="mc-secondary">北京视界设计有限公司</span></td><td class="mc-money">${p.id==='P1'?'6,000.00':'12,000.00'}</td><td>项目共同费用<span class="mc-secondary">尚未分到活动</span></td></tr></tbody></table></div><div class="mc-section-title"><h3>活动费用</h3></div>${facts([['活动已确认费用',`¥ ${money(state.activities.filter(a=>a.project===p.id).reduce((v,a)=>v+a.cost,0))}`],['项目费用合计',`¥ ${money(state.activities.filter(a=>a.project===p.id).reduce((v,a)=>v+a.cost,0)+(p.id==='P1'?6000:12000))}`],['客户价款范围',p.id==='P1'?'按已确认活动汇总':'180,000.00 · 整包未分场'],['逐场毛利',p.id==='P1'?'共同费用未分配，暂不确认逐场毛利':'客户价款未分场，暂不计算']])}`;default:return `${facts([['项目负责人',esc(p.manager)],['销售负责人',esc(p.sales)],['项目期间',p.id==='P1'?'2026-01-01 至 2026-12-31':'2026-09-15 至 2026-11-15'],['我方签约公司','凯撒会展服务有限公司']])}<div class="mc-section-title"><h3>项目组成员</h3></div><div class="mc-table-wrap"><table class="mc-small-table"><colgroup><col style="width:100px"><col></colgroup><thead><tr><th>姓名</th><th>项目分工</th></tr></thead><tbody>${p.team.map(([n,r])=>`<tr><td>${n}</td><td>${r}</td></tr>`).join('')}</tbody></table></div>`;}}
 function projectDetail(){const p=project();return pageHead('产品中心 / 单团项目 / 项目详情',p.name,`${p.contract} · 销售 ${p.sales} · 项目负责人 ${p.manager}`,p.status,'back-projects')+`<div class="mc-layout ${side?'has-side':''}"><section class="mc-panel">${tabs(['活动安排','客户约定','项目费用','项目资料'],'project')}<div class="mc-pad" role="tabpanel" id="mc-tab-panel" aria-labelledby="mc-tab-project-${['活动安排','客户约定','项目费用','项目资料'].indexOf(state.projectTab)}">${projectContent()}</div></section>${sideMarkup()}</div>`;}
 function executionList(){return pageHead('履约中心 / 团期管控 / 项目活动','项目活动','')+`<div class="mc-layout ${side?'has-side':''}"><section class="mc-panel mc-pad"><div class="mc-toolbar">${filters()}${btn('分配负责人','assign','',selected.size?'':'disabled')}</div>${activitiesTable(filtered(),true)}</section>${sideMarkup()}</div>`;}
 function activityContent(){const a=activity();if(a.status==='草稿')return facts([['活动名称',esc(a.name)],['计划日期',esc(a.date)],['负责人',esc(a.owner)],['客户确认','待补充'],['服务范围','待补充'],['执行资料','待补充']]);switch(state.activityTab){case '执行安排':return `${facts([['活动日期',esc(a.date)],['场地',esc(a.venue)],['参会人数',`${a.people} 人`],['现场负责人',esc(a.owner)],['服务范围',esc(a.service)],['客户确认依据',esc(a.customerDoc)]])}<div class="mc-section-title"><h3>${a.status==='已完成'?'实际执行':'执行日程'}</h3></div><div class="mc-record"><div class="mc-record-line"><span>08:30—09:00　签到与接待</span><span>${esc(a.owner)}</span></div><small>${esc(a.city)} · 主会场入口</small></div><div class="mc-record"><div class="mc-record-line"><span>09:00—12:00　${a.id==='A3'?'品牌发布与媒体交流':'主题交流与讨论'}</span><span>会务组</span></div><small>${a.status==='已完成'?'实际服务完成，资料已归档':'会场、音响与茶歇已确认'}</small></div><div class="mc-section-title"><h3>完成与验收</h3></div>${facts([['服务完成',a.status==='已完成'?'2026-10-05 · 已完成':'未完成'],['客户验收',esc(a.accepted)]])}`;case '费用采购':return `<div class="mc-section-title"><h3>供应商费用</h3><span class="mc-sub">金额单位：元 · 含税</span></div><div class="mc-table-wrap"><table class="mc-fee-table"><colgroup><col><col style="width:100px"><col style="width:95px"><col style="width:95px"><col style="width:95px"><col class="mc-operation"></colgroup><thead><tr><th>费用 / 供应商</th><th>费用金额</th><th>实际已付</th><th>申请中</th><th>可申请</th><th class="mc-operation">操作</th></tr></thead><tbody><tr><td><strong class="mc-name">${a.id==='A3'?'场地与搭建':'酒店与会场'}</strong><span class="mc-secondary">${esc(a.id==='A1'?'上海浦江会议酒店':a.id==='A2'?'杭州西湖会议中心':'北京星河会展服务')}</span></td><td class="mc-money">${money(a.hotel)}</td><td class="mc-money" data-value="paid">${money(a.paid)}</td><td class="mc-money" data-value="pending">${money(a.pending)}</td><td class="mc-money" data-value="available">${money(a.hotel-a.paid-a.pending)}</td><td class="mc-operation">${btn('详情','fee-detail','link')}</td></tr><tr><td>交通与会务<span class="mc-secondary">${a.id==='A3'?'北京嘉程会务服务':'当地会务服务公司'}</span></td><td class="mc-money">${money(a.cost-a.hotel)}</td><td class="mc-money">0.00</td><td class="mc-money">0.00</td><td class="mc-money">${money(a.cost-a.hotel)}</td><td class="mc-operation">${btn('查看','other-fee','link')}</td></tr></tbody></table></div><div class="mc-section-title"><h3>付款申请记录</h3></div>${requestRecords(a)}`;case '客户款项':return `${facts([['客户',esc(projects.find(p=>p.id===a.project).customer)],['客户确认依据',esc(a.customerDoc)],['本场客户确认金额',a.confirmed===null?'整包客户价款未分场':`¥ ${money(a.confirmed)}`],['实际已收',a.received===null?'在项目客户约定中核对':`¥ ${money(a.received)}`],['开票情况',a.id==='A2'?'已开票 36,000.00 元':a.id==='A3'?'项目整包开票，未分场':'未开票'],['收款节点',a.id==='A3'?'按整包合同约定办理':'确认后40%，月度验收后结清']])}<div class="mc-section-title"><h3>关联收款记录</h3></div>${a.received!==null?`<div class="mc-record"><div class="mc-record-line"><span>收款单 SK-${a.id==='A1'?'202610-018':'202610-005'}</span><span class="mc-money">¥ ${money(a.received)}</span></div><small>财务已确认 · ${a.id==='A1'?'10月2日':'10月3日'}</small></div>`:`<div class="mc-record">项目累计已收 72,000.00 元<small>归属整包合同，尚未按活动分摊</small></div>`}`;case '结算核对':return `${facts([['服务完成',a.status==='已完成'?'已完成 · 2026-10-05':'未完成'],['客户验收',esc(a.accepted)],['客户结算',a.id==='A2'?'已确认 36,000.00 元':'未提交'],['供应商对账',a.id==='A2'?'酒店费用已确认':'待最终对账'],['客户未收款',a.confirmed===null?'整包核对':`¥ ${money(a.confirmed-a.received)}`],['供应商酒店未付',`¥ ${money(a.hotel-a.paid)}`]])}<div class="mc-section-title"><h3>结算资料</h3></div><div class="mc-record">${a.id==='A2'?'客户验收单 HK-1005 · 已归档':'客户验收依据待补充'}</div><div class="mc-record">${a.id==='A2'?'供应商确认账单 HZ-1005 · 已归档':'供应商最终账单待确认'}</div>`;default:return `${facts([['活动负责人',`${esc(a.owner)} · 本场执行、费用及结算资料`],['资源协作','王珊 · 酒店与特殊资源'],['资料协作','刘晴 · 参会名单与材料'],['项目负责人','陈敏 · 项目统筹']])}<div class="mc-section-title"><h3>资料与处理记录</h3></div><div class="mc-record">${esc(a.customerDoc)}<small>客户服务范围及价格确认依据</small></div><div class="mc-record">活动日程与参会名单<small>${a.people} 人 · 由 ${esc(a.owner)} 维护</small></div>${state.requests.filter(r=>r.activity===a.id).map(r=>`<div class="mc-record">付款申请已提交审批 · ${money(r.amount)} 元<small>${esc(r.id)} · 经办 林晓 · 实际付款未变更</small></div>`).join('')}`;}}
 function requestRecords(a){return `${a.id==='A1'?`<div class="mc-record"><div class="mc-record-line"><span>付款申请 FKSQ-1010-02</span><span class="mc-money">4,000.00 元</span></div><small>审批中 · 酒店第二笔订金</small></div>`:''}${state.requests.filter(r=>r.activity===a.id).map(r=>`<div class="mc-record"><div class="mc-record-line"><span>${esc(r.id)}</span><span class="mc-money">${money(r.amount)} 元</span></div><small>审批中 · ${esc(r.purpose)}</small></div>`).join('')}${a.id!=='A1'&&!state.requests.some(r=>r.activity===a.id)?'<div class="mc-inline-note">暂无申请中的付款</div>':''}`;}
 function activityDetail(){const a=activity(),p=projects.find(p=>p.id===a.project);return pageHead('履约中心 / 团期管控 / 活动详情',a.name,`${esc(p.name)} · ${a.date} · 负责人 ${a.owner}`,a.status,'back-activity')+`<div class="mc-layout ${side?'has-side':''}"><section class="mc-panel"><dl class="mc-summary"><div><dt>客户确认金额</dt><dd>${a.confirmed===null?(a.status==='草稿'?'待客户确认':'整包未分场'):`¥ ${money(a.confirmed)}`}</dd></div><div><dt>已确认费用</dt><dd>¥ ${money(a.cost)}</dd></div><div><dt>客户验收</dt><dd>${a.accepted}</dd></div></dl>${tabs(['执行安排','费用采购','客户款项','结算核对','资料记录'],'activity')}<div class="mc-pad" role="tabpanel" id="mc-tab-panel" aria-labelledby="mc-tab-activity-${['执行安排','费用采购','客户款项','结算核对','资料记录'].indexOf(state.activityTab)}">${activityContent()}</div></section>${sideMarkup()}</div>`;}
 function sideMarkup(){if(!side)return '';const a=activity();let title='',body='';if(side==='fee'||side==='payment'||side==='payment-record'){const available=a.hotel-a.paid-a.pending;title=side==='payment'?'付款申请':side==='payment-record'?'付款记录':'费用详情';body=side==='payment-record'?`${facts([['付款单号',a.id==='A1'?'FK-202610-006':'FK-202610-004'],['财务状态','已付款'],['实际付款',`¥ ${money(a.paid)}`],['付款对象',a.id==='A1'?'上海浦江会议酒店':a.id==='A2'?'杭州西湖会议中心':'北京星河会展服务'],['办理入口','财务管理 / 付款执行']])}`:`<h3>${a.id==='A3'?'场地与搭建':'酒店与会场'}</h3><p class="mc-sub">${esc(a.name)}</p><hr class="mc-divider"><dl class="mc-facts single"><div><dt>含税费用</dt><dd class="mc-money">¥ ${money(a.hotel)}</dd></div><div><dt>实际已付</dt><dd class="mc-money">¥ ${money(a.paid)}</dd></div><div><dt>申请中</dt><dd class="mc-money">¥ ${money(a.pending)}</dd></div><div><dt>可申请金额</dt><dd class="mc-money">¥ ${money(available)}</dd></div></dl><p class="mc-inline-note">本项无其他冲抵金额</p><hr class="mc-divider">${side==='payment'?`<form id="mc-payment-form" class="mc-form"><label class="mc-field">本次申请金额（元）<input id="mc-amount" name="amount" inputmode="decimal" type="number" min="0.01" step="0.01" required aria-describedby="mc-payment-error" placeholder="请输入金额"></label><label class="mc-field">付款用途<input name="purpose" value="酒店第二笔订金" required></label><label class="mc-field">申请说明<textarea name="note" placeholder="可填写合同付款节点或补充说明"></textarea></label><div id="mc-payment-error" class="mc-error" role="alert"></div><div class="mc-form-actions">${btn('提交审批','submit-payment','primary','type="submit"')}${btn('取消','fee-detail')}</div></form>`:`${facts([['服务依据',a.id==='A3'?'场地与搭建合同':'酒店确认单 · 会场及住宿'],['发票情况',a.id==='A2'?'已收票，财务已核对':'未收票'],['票面税率',a.id==='A2'?'6%':'待取得发票后核对'],['税额与抵扣',a.id==='A2'?'按财务核对结果办理':'待财务核对']])}<div class="mc-form-actions">${btn('付款申请','payment','primary',available>0?'':'disabled')}${a.paid>0?btn('查看付款','payment-record'):''}</div>`}`;}else if(side==='other-fee'){title='交通与会务费用';body=facts([['费用金额',`¥ ${money(a.cost-a.hotel)}`],['服务内容','会务支持与现场交通'],['供应商','当地会务服务公司'],['确认依据','采购服务确认单'],['发票情况','未收票'],['税额与抵扣','待财务核对']]);}else if(side==='batch'){title='批量新增活动';body=`<form id="mc-batch-form"><div id="mc-batch-rows">${Array.from({length:batchCount},(_,i)=>`<div class="mc-batch-row"><label class="mc-field">活动名称 ${i+1}<input name="name-${i}" placeholder="如：南京医学交流会" required></label><label class="mc-field">计划日期<input type="date" name="date-${i}" value="2026-10-22" required></label><label class="mc-field">负责人<select name="owner-${i}"><option>赵悦</option><option>周宁</option><option>陈敏</option></select></label></div>`).join('')}</div><div id="mc-batch-error" class="mc-error" role="alert"></div><div class="mc-form-actions">${btn('保存草稿','save-batch','primary')}${btn('取消','close-side')}</div></form>`;}else if(side==='assign'){title='分配负责人';body=`<p class="mc-sub">已选择 ${selected.size} 场活动</p><hr class="mc-divider"><form id="mc-assign-form" class="mc-form"><label class="mc-field">活动负责人<select name="owner"><option>赵悦</option><option>周宁</option><option>陈敏</option></select></label><div class="mc-form-actions">${btn('保存分配','save-assign','primary')}${btn('取消','close-side')}</div></form>`;}return `<aside class="mc-side" aria-label="${title}"><div class="mc-side-head"><h2>${title}</h2>${btn('关闭','close-side','link')}</div>${body}</aside>`;}
 function render(){root.dataset.density=state.density;root.querySelectorAll('[data-screen]').forEach(b=>b.setAttribute('aria-current',(state.screen==='project'||state.screen==='projects'?'projects':'activities')===b.dataset.screen?'page':'false'));main.innerHTML=state.screen==='projects'?projectList():state.screen==='project'?projectDetail():state.screen==='activities'?executionList():activityDetail();if(side==='fee'||side==='payment'){const note=root.querySelector('.mc-side .mc-inline-note');if(note)note.textContent='采购已确认，合同付款节点已到；本项无其他冲抵。';root.querySelectorAll('.mc-side dt').forEach(dt=>{if(dt.textContent==='申请中')dt.textContent='申请中（尚未实付）';});}}
 function showSide(kind){side=kind;render();}
 root.addEventListener('click',e=>{const nav=e.target.closest('[data-screen]');if(nav){state.month='全部月份';state.owner='全部负责人';navigate(nav.dataset.screen);return;}const tab=e.target.closest('[data-tab]');if(tab){state[tab.dataset.type+'Tab']=tab.dataset.tab;side=null;render();save();return;}const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;if(action==='back-projects')navigate('projects');else if(action==='open-project'){state.projectId=b.dataset.id;state.projectTab='活动安排';state.month='全部月份';state.owner='全部负责人';navigate('project');}else if(action==='open-activity'){state.returnScreen=state.screen;state.activityId=b.dataset.id;state.projectId=activity().project;state.activityTab='执行安排';navigate('activity');}else if(action==='back-activity'){navigate(state.returnScreen);}else if(action==='batch-add'){batchCount=2;showSide('batch');}else if(action==='assign'){showSide('assign');}else if(action==='close-side'){side=null;render();}else if(action==='fee-detail'){showSide('fee');}else if(action==='other-fee'){showSide('other-fee');}else if(action==='payment'){showSide('payment');root.querySelector('#mc-amount')?.focus({preventScroll:true});}else if(action==='payment-record'){showSide('payment-record');}else if(action==='submit-payment'){e.preventDefault();submitPayment();}else if(action==='save-batch'){e.preventDefault();saveBatch();}else if(action==='save-assign'){e.preventDefault();const owner=root.querySelector('#mc-assign-form select').value;state.activities.forEach(a=>{if(selected.has(a.id))a.owner=owner;});const n=selected.size;selected.clear();side=null;render();save();tell(`已将 ${n} 场活动分配给 ${owner}`);}});
 root.addEventListener('change',e=>{if(e.target.matches('[data-filter]')){state[e.target.dataset.filter]=e.target.value;selected.clear();side=null;render();save();}if(e.target.matches('[data-select]')){e.target.checked?selected.add(e.target.dataset.select):selected.delete(e.target.dataset.select);render();}if(e.target.matches('[data-select-all]')){const ids=filtered(state.screen==='project'?state.projectId:null).map(a=>a.id);ids.forEach(id=>e.target.checked?selected.add(id):selected.delete(id));render();}});
 root.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='mc-payment-form')submitPayment();else if(e.target.id==='mc-batch-form')saveBatch();});
 function submitPayment(){const form=root.querySelector('#mc-payment-form');if(!form||!form.reportValidity())return;const a=activity(),amount=Number(form.elements.amount.value),available=Math.round((a.hotel-a.paid-a.pending)*100)/100;if(!Number.isFinite(amount)||amount<=0||amount>available){root.querySelector('#mc-payment-error').textContent=`本次申请不能超过可申请金额 ${money(available)} 元。`;return;}a.pending=Math.round((a.pending+amount)*100)/100;state.requests.push({id:`付款申请 FKSQ-讨论-${String(state.requests.length+1).padStart(2,'0')}`,activity:a.id,amount,purpose:form.elements.purpose.value});side='fee';render();save();tell(`付款申请 ${money(amount)} 元已提交审批；实际已付仍为 ${money(a.paid)} 元。`);}
 function saveBatch(){const form=root.querySelector('#mc-batch-form');if(!form||!form.reportValidity())return;const rows=Array.from({length:batchCount},(_,i)=>({name:form.elements['name-'+i].value.trim(),date:form.elements['date-'+i].value,owner:form.elements['owner-'+i].value}));if(rows.some(r=>!r.name)||rows.some((r,i)=>rows.findIndex(x=>x.name===r.name&&x.date===r.date)!==i)||rows.some(r=>state.activities.some(a=>a.project===state.projectId&&a.name===r.name&&a.date===r.date))){root.querySelector('#mc-batch-error').textContent='请检查活动名称；同一项目不能重复保存同名同日活动。';return;}rows.forEach(r=>state.activities.push({id:'A'+(state.activities.length+1),project:state.projectId,...r,city:'',people:0,status:'草稿',confirmed:null,cost:0,received:0,accepted:'未开始',hotel:0,paid:0,pending:0}));state.month='全部月份';state.owner='全部负责人';side=null;render();save();tell(`已新增 ${rows.length} 场草稿活动`);}
 window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){const incoming=restore(e.detail.globals.widgetState);if(incoming.revision<state.revision||JSON.stringify(incoming)===JSON.stringify(state))return;state=incoming;side=null;selected.clear();render();}});
 render();
 if(globalThis.Tweak){const design={density:state.density};const tweak=new Tweak({container:root,onChange:()=>{state.density=design.density;root.dataset.density=state.density;save();}});tweak.addSelect(design,'density',{label:'列表密度',options:['标准','紧凑'],reference:'mice.list-density'});}
})();
</script>
