<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>产品供给安排 - 凯撒旅游</title>
  <link rel="stylesheet" href="../shared/style.css">
</head>
<body>
  <script src="../shared/nav-supplier.js"></script>
  <script src="../shared/schedule-route-catalog.js"></script>
  <script src="../shared/supplier-schedule-drawer.js"></script>

  <main class="product-schedule-page supplier-supply-page">
    <section class="page-workbar product-schedule-workbar">
      <div class="page-title-row">
        <a class="page-back-link" href="products.html">返回</a>
        <h1 id="productSchedulePageTitle" class="page-title">产品供给安排</h1>
      </div>
      <div class="btn-group">
        <a id="productScheduleDetailLink" class="btn btn-secondary" href="product-detail.html">产品详情</a>
        <button id="openProductScheduleDrawer" class="btn btn-primary" type="button">新建安排</button>
      </div>
    </section>

    <section class="card product-schedule-hero" aria-label="当前产品信息">
      <figure class="product-schedule-cover">
        <img id="summaryProductCover" src="https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=900&q=80" alt="产品封面">
        <figcaption class="product-schedule-cover-overlay">
          <span id="summaryProductStatus" class="tag tag-green">已采用</span>
          <strong id="summaryProductName">-</strong>
          <small id="summaryProductMeta">-</small>
        </figcaption>
      </figure>
      <div class="product-schedule-info">
        <div class="product-schedule-field-grid">
          <div class="product-schedule-field"><span>产品编号</span><strong id="summaryProductCode">-</strong></div>
          <div class="product-schedule-field"><span>产品类型</span><strong id="summaryProductType">-</strong></div>
          <div class="product-schedule-field"><span>旅游类型</span><strong id="summaryTravelType">-</strong></div>
          <div class="product-schedule-field"><span>凯撒采用</span><strong id="summarySubjectCompany">-</strong></div>
          <div class="product-schedule-field"><span>凯撒对接</span><strong id="summaryOwnerOrg">-</strong></div>
          <div class="product-schedule-field"><span>出发地</span><strong id="summaryDeparture">-</strong></div>
          <div class="product-schedule-field"><span>目的地</span><strong id="summaryDestination">-</strong></div>
        </div>
        <div class="product-schedule-context">
          <div class="product-schedule-sale-metric">
            <span>供给安排</span>
            <div><strong id="summarySaleCount">0</strong><em id="summarySaleObject">个团期</em></div>
          </div>
          <div id="summaryRouteScheduleStats" class="product-schedule-context-stat">-</div>
          <div id="summaryOwnerLine" class="product-schedule-context-audit">-</div>
        </div>
      </div>
    </section>

    <section class="product-schedule-route-section" aria-label="产品线路或套餐">
      <div id="productScheduleRoutes" class="product-schedule-route-grid"></div>
    </section>

    <section class="filter-card filter-card-compact product-schedule-filter-surface" aria-label="产品供给安排筛选">
      <div class="filter-row">
        <div class="filter-item filter-item-search product-schedule-filter-keyword">
          <label class="sr-only" for="scheduleKeyword">安排编号/线路名称</label>
          <input id="scheduleKeyword" type="text" placeholder="安排编号/线路名称">
        </div>
        <div class="filter-item-sm">
          <label class="sr-only" for="scheduleStatusFilter">状态</label>
          <select id="scheduleStatusFilter">
            <option value="">全部状态</option>
            <option>可售</option>
            <option>需确认</option>
            <option>售罄</option>
            <option>已关闭</option>
          </select>
        </div>
        <div class="filter-item-sm">
          <label class="sr-only" for="scheduleDepartMonth">出发月份</label>
          <select id="scheduleDepartMonth">
            <option value="">全部月份</option>
            <option value="2026-07">2026-07</option>
            <option value="2026-08">2026-08</option>
            <option value="2026-09">2026-09</option>
            <option value="2026-10">2026-10</option>
          </select>
        </div>
        <label class="filter-check"><input id="hideStoppedSchedules" type="checkbox" checked> 隐藏已关闭</label>
        <div class="filter-actions">
          <button id="resetProductScheduleFilters" class="btn btn-secondary" type="button">重置</button>
        </div>
      </div>
    </section>

    <section class="list-surface product-schedule-table-surface" data-list-surface>
      <section class="table-wrap list-surface-table list-table-with-pagination product-schedule-table-wrap" aria-label="产品供给安排列表">
        <table class="product-schedule-table supplier-product-supply-table">
          <colgroup>
            <col class="product-schedule-col-code">
            <col class="product-schedule-col-route">
            <col class="product-schedule-col-date">
            <col class="product-schedule-col-supply-status">
            <col class="product-schedule-col-stock">
            <col class="product-schedule-col-price">
            <col class="product-schedule-col-caesar">
            <col class="product-schedule-col-action">
          </colgroup>
          <thead>
            <tr>
              <th id="scheduleCodeHead">安排编号</th>
              <th>使用线路/套餐</th>
              <th>出发/回团</th>
              <th>供给状态</th>
              <th>余位/总量</th>
              <th>供应商报价</th>
              <th>凯撒承接</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="productScheduleRows"></tbody>
        </table>
      </section>

      <div class="pagination list-surface-pagination list-pagination-attached">
        <span id="productSchedulePager">0 条</span>
      </div>
    </section>
  </main>

  <div id="supplyInventoryDrawer" class="modal-overlay drawer-overlay" aria-hidden="true" hidden>
    <div class="modal drawer-modal supplier-supply-drawer" role="dialog" aria-modal="true" aria-labelledby="supplyInventoryTitle">
      <div class="modal-header">
        <div id="supplyInventoryTitle" class="modal-title">余位维护</div>
        <button class="modal-close" type="button" data-close-supply-inventory aria-label="关闭">×</button>
      </div>
      <div class="modal-body">
        <section class="drawer-section">
          <div class="drawer-section-head">
            <h3 class="drawer-section-title">当前安排</h3>
          </div>
          <div id="supplyInventorySummary" class="description-grid"></div>
        </section>
        <section class="drawer-section">
          <div class="drawer-section-head">
            <h3 class="drawer-section-title">供给状态</h3>
          </div>
          <div class="form-grid form-grid-2">
            <div class="form-group">
              <label class="form-label" for="supplyStatusInput">供给状态</label>
              <select id="supplyStatusInput" class="form-control">
                <option>可售</option>
                <option>需确认</option>
                <option>售罄</option>
                <option>已关闭</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="supplyConfirmModeInput">确认方式</label>
              <select id="supplyConfirmModeInput" class="form-control">
                <option>固定配额</option>
                <option>每单确认</option>
                <option>房态回传</option>
                <option>舱位回传</option>
                <option>铺位回传</option>
                <option>仅询位</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="supplyTotalInput">总可供数量</label>
              <input id="supplyTotalInput" class="form-control" type="number" min="0">
            </div>
            <div class="form-group">
              <label class="form-label" for="supplyLeftInput">当前余位</label>
              <input id="supplyLeftInput" class="form-control" type="number" min="0">
            </div>
            <div class="form-group">
              <label class="form-label" for="supplyUsedInput">凯撒已占用</label>
              <input id="supplyUsedInput" class="form-control" type="text" readonly>
            </div>
            <div class="form-group">
              <label class="form-label" for="supplyPendingInput">待确认占用</label>
              <input id="supplyPendingInput" class="form-control" type="text" readonly>
            </div>
            <div class="form-group">
              <label class="form-label" for="supplyDeadlineInput">报名截止日</label>
              <input id="supplyDeadlineInput" class="form-control" type="date">
            </div>
            <div class="form-group">
              <label class="form-label" for="supplyReserveInput">确认后保留</label>
              <select id="supplyReserveInput" class="form-control">
                <option>2小时</option>
                <option>4小时</option>
                <option>24小时</option>
                <option>48小时</option>
              </select>
            </div>
            <div class="form-group form-group-full">
              <label class="form-label" for="supplyInventoryReason">变更原因</label>
              <textarea id="supplyInventoryReason" class="form-control" rows="3" placeholder="填写余位变化、售罄、关闭或确认方式调整原因"></textarea>
            </div>
          </div>
        </section>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" type="button" data-close-supply-inventory>取消</button>
        <button id="saveSupplyInventoryDraft" class="btn btn-secondary" type="button">保存草稿</button>
        <button id="submitSupplyInventory" class="btn btn-primary" type="button">提交凯撒确认</button>
      </div>
    </div>
  </div>

  <div id="supplyPriceDrawer" class="modal-overlay drawer-overlay" aria-hidden="true" hidden>
    <div class="modal drawer-modal supplier-supply-drawer supplier-price-drawer" role="dialog" aria-modal="true" aria-labelledby="supplyPriceTitle">
      <div class="modal-header">
        <div id="supplyPriceTitle" class="modal-title">报价维护</div>
        <button class="modal-close" type="button" data-close-supply-price aria-label="关闭">×</button>
      </div>
      <div class="modal-body">
        <section class="drawer-section">
          <div class="drawer-section-head">
            <h3 class="drawer-section-title">当前安排</h3>
          </div>
          <div id="supplyPriceSummary" class="description-grid"></div>
        </section>
        <section class="drawer-section">
          <div class="drawer-section-head">
            <h3 class="drawer-section-title">价格结构</h3>
          </div>
          <div class="table-wrap drawer-table-fit supplier-price-matrix-wrap">
            <table class="supplier-price-matrix-table">
              <thead>
                <tr>
                  <th>价格项</th>
                  <th>供应商结算价</th>
                  <th>供应商公开价</th>
                </tr>
              </thead>
              <tbody id="supplyPriceRows"></tbody>
            </table>
          </div>
          <div class="form-grid form-grid-2 supplier-price-extra-grid">
            <div class="form-group">
              <label class="form-label" for="supplyPriceValidInput">报价有效期</label>
              <input id="supplyPriceValidInput" class="form-control" type="date">
            </div>
            <div class="form-group">
              <label class="form-label" for="supplyPriceImpactInput">已确认订单影响</label>
              <select id="supplyPriceImpactInput" class="form-control">
                <option>不影响</option>
                <option>仅新单生效</option>
                <option>已确认订单需补差</option>
              </select>
            </div>
            <div class="form-group form-group-full">
              <label class="form-label" for="supplyPriceReason">价格变更原因</label>
              <textarea id="supplyPriceReason" class="form-control" rows="3" placeholder="填写整体报价变化、补差口径或有效期调整原因"></textarea>
            </div>
          </div>
        </section>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" type="button" data-close-supply-price>取消</button>
        <button id="saveSupplyPriceDraft" class="btn btn-secondary" type="button">保存草稿</button>
        <button id="submitSupplyPrice" class="btn btn-primary" type="button">提交凯撒确认</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var catalog = window.caesarScheduleRouteCatalog || [];
      function escapeHtml(value) {
        return String(value == null ? "" : value).replace(/[&<>"']/g, function (char) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char];
        });
      }
      function objectName(batchType) {
        if (batchType === "邮轮航次") return "航次";
        if (batchType === "专列班期") return "班期";
        if (batchType === "自由行出行日期") return "出行日期";
        if (batchType === "研学营期") return "营期";
        return "团期";
      }
      function statusClass(status) {
        if (status === "可售" || status === "凯撒已采用" || status === "已采用") return "tag tag-green";
        if (status === "需确认" || status === "售罄" || status === "凯撒退回" || status === "待凯撒确认") return "tag tag-orange";
        if (status === "价格变更" || status === "余位变更") return "tag tag-blue";
        if (status === "已关闭") return "tag tag-gray";
        return "tag tag-gray";
      }
      function normalizeSupplyStatus(status, stock, sold) {
        if (status === "已停售" || status === "停售" || status === "已关闭") return "已关闭";
        if (status === "售罄") return "售罄";
        if (status === "少量" || status === "待补充" || status === "余位变更" || status === "价格变更" || status === "待凯撒确认") return "需确认";
        if (Number(stock || 0) <= Number(sold || 0) && Number(stock || 0) > 0) return "售罄";
        return "可售";
      }
      function normalizeConfirmMode(value, typeKey) {
        var text = String(value || "");
        if (/实时|固定/.test(text)) return "固定配额";
        if (/房态|酒店/.test(text)) return "房态回传";
        if (/舱/.test(text)) return "舱位回传";
        if (/铺/.test(text)) return "铺位回传";
        if (/询位/.test(text)) return "仅询位";
        if (typeKey === "free") return "房态回传";
        if (typeKey === "cruise") return "舱位回传";
        if (typeKey === "train") return "铺位回传";
        return "每单确认";
      }
      function displayCaesarStatus(value) {
        if (!value || value === "未出团" || value === "操作中") return "凯撒已采用";
        if (value === "已采用") return "凯撒已采用";
        return value;
      }
      function supplyLeft(item) {
        if (item.left != null) return Number(item.left || 0);
        return Math.max(Number(item.stock || 0) - Number(item.caesarUsed || item.sold || 0), 0);
      }
      function productCoverUrl(product) {
        var coverMap = {
          "GT-EU-001": "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=900&q=80",
          "GT-JP-002": "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=900&q=80",
          "CR-MED-001": "https://images.unsplash.com/photo-1544550285-f813152fb2fd?auto=format&fit=crop&w=900&q=80",
          "TR-SILK-001": "https://images.unsplash.com/photo-1473448912268-2022ce9509d8?auto=format&fit=crop&w=900&q=80",
          "ST-DH-001": "https://images.unsplash.com/photo-1548013146-72479768bada?auto=format&fit=crop&w=900&q=80"
        };
        return coverMap[product.productCode] || "https://images.unsplash.com/photo-1467269204594-9661b134dd2b?auto=format&fit=crop&w=900&q=80";
      }
      function numericPrice(price) {
        return String(price || "0").replace(/[¥,\s]/g, "") || "0";
      }
      function formattedPrice(value) {
        return "¥" + Number(value || 0).toLocaleString("zh-CN");
      }
      function publicPriceBySettlement(price) {
        var base = Number(numericPrice(price));
        if (!base) return "¥0";
        return formattedPrice(Math.ceil(base * 1.1 / 10) * 10);
      }
      function priceNumber(price) {
        return Number(numericPrice(price));
      }
      function priceItemDefaults(settlement, publicPrice, typeKey) {
        var adultSettlement = priceNumber(settlement);
        var adultPublic = priceNumber(publicPrice || publicPriceBySettlement(settlement));
        var names = typeKey === "cruise"
          ? ["内舱", "海景舱", "阳台舱", "套房", "港务费", "补差"]
          : typeKey === "train"
            ? ["硬卧", "软卧", "高级软卧", "服务费", "补差"]
            : typeKey === "free"
              ? ["成人套餐", "儿童套餐", "单房差", "服务费", "补差"]
              : ["成人", "儿童占床", "儿童不占床", "单房差", "服务费", "补差"];
        var ratios = [1, 0.82, 0.72, 0.25, 0, 0];
        return names.map(function (name, index) {
          return {
            name: name,
            settlement: Math.round(adultSettlement * (ratios[index] || 0)),
            public: Math.round(adultPublic * (ratios[index] || 0))
          };
        });
      }
      function ownerOrgFor(route) {
        route = route || {};
        if (route.ownerOrg) return route.ownerOrg;
        if (route.typeKey === "cruise") return "产品中心 / 邮轮部";
        if (route.typeKey === "train") return "产品中心 / 专列部";
        if (route.typeKey === "free") return "产品中心 / 自由行部";
        if (route.typeKey === "study") return "产品中心 / 研学部";
        if (route.typeKey === "domestic") return "短线中心 / 国内部";
        if (/日本|关西|新加坡|亚洲/.test((route.product || "") + (route.destination || ""))) return "长线中心 / 亚洲部";
        return "长线中心 / 欧洲部";
      }
      var productNameParam = params.get("productName") || params.get("product") || "欧洲十国经典游";
      var typeParam = params.get("type") || "";
      var routeParam = params.get("route") || params.get("routeName") || "";
      var activeRoute = routeParam || "__all";

      function productMatches(route) {
        var name = productNameParam.trim();
        if (!name) return false;
        return route.product === name || route.productTitle === name || route.productTitle.indexOf(name) >= 0 || route.product.indexOf(name) >= 0;
      }

      function typeMatches(route) {
        if (!typeParam) return true;
        return route.typeKey === typeParam || route.type === typeParam || route.batchType === typeParam;
      }

      function supplierProductFallbackRoutes(name, type) {
        var fallbackMap = {
          "西欧精选8日散拼": [{
            product: "西欧精选8日散拼",

              ["SUPG20260705001", "2026-07-05", "2026-07-12", "2026-06-30", 20, 8, "¥5,750", "销售中", "凯撒已采用"],
              ["SUPG20260726001", "2026-07-26", "2026-08-02", "2026-07-18", 20, 4, "¥5,980", "销售中", "凯撒已采用"],
              ["SUPG20260809001", "2026-08-09", "2026-08-16", "2026-08-01", 20, 0, "¥6,280", "待凯撒确认", "待凯撒确认"]
            ]
          }],
          "北欧极光12日散拼": [{
            product: "北欧极光12日散拼",

            productCode: "SUP-G02",

            schedules: [
              ["SUPF20260720001", "2026-07-20", "2026-07-24", "2026-07-13", 6, 2, "¥3,680", "销售中", "凯撒已采用"],
              ["SUPF20260803001", "2026-08-03", "2026-08-07", "2026-07-27", 6, 3, "¥3,980", "销售中", "凯撒已采用"],
              ["SUPF20260817001", "2026-08-17", "2026-08-21", "2026-08-10", 6, 0, "¥3,880", "待凯撒确认", "待凯撒确认"]
            ]
          }]
        };
        var rows = fallbackMap[name] || [];
        if (!type) return rows;
        return rows.filter(function (route) { return route.typeKey === type || route.type === type; });
      }

      var routes = catalog.filter(function (route) {
        return productMatches(route) && typeMatches(route);
      });

      if (!routes.length) {
        routes = catalog.filter(function (route) { return productMatches(route); });
      }
      if (!routes.length) {
        routes = supplierProductFallbackRoutes(productNameParam.trim(), typeParam);
      }
      if (!routes.length) {
        routes = catalog.filter(function (route) { return route.product === "欧洲十国经典游"; });
      }

      var profile = routes[0] || {};
      var schedules = routes.flatMap(function (route) {
        return (route.schedules || []).map(function (item) {
          var supplyStatus = normalizeSupplyStatus(item[7], item[4], item[5]);
          var settlementPrice = item[10] || item[6];
          var publicPrice = item[9] || publicPriceBySettlement(item[6]);
          return {
            code: item[0],
            route: route.route,
            routeCode: route.routeCode,
            product: route.product,
            productTitle: route.productTitle,
            type: route.type,
            typeKey: route.typeKey,
            batchType: route.batchType,
            depart: item[1],
            back: item[2],
            deadline: item[3],
            stock: Number(item[4] || 0),
            caesarUsed: Number(item[5] || 0),
            pendingUsed: supplyStatus === "需确认" ? Math.min(Number(item[5] || 0), 2) : 0,
            left: Math.max(Number(item[4] || 0) - Number(item[5] || 0), 0),
            publicPrice: publicPrice,
            settlementPrice: settlementPrice,
            price: settlementPrice,
            priceValidUntil: "2026-08-31",
            priceImpact: "不影响",
            priceItems: priceItemDefaults(settlementPrice, publicPrice, route.typeKey),
            confirmMode: normalizeConfirmMode(item[11], route.typeKey),
            reserveHours: "4小时",
            status: supplyStatus,
            execution: item[8],
            company: route.company || "凯撒外采",
            ownerOrg: route.ownerOrg || ownerOrgFor(route),
            unit: route.unit || "人"
          };
        });
      });

      function setText(id, value) {
        var el = document.getElementById(id);
        if (el) el.textContent = value;
      }

      function detailHref(item) {
        var query = new URLSearchParams();
        query.set("source", "product");
        query.set("scheduleNo", item.code);
        query.set("productName", item.product);
        query.set("type", item.typeKey || "");
        query.set("package", item.route);
        query.set("company", item.company || profile.company || "凯撒外采");
        query.set("ownerOrg", item.ownerOrg || ownerOrgFor(item));
        return "schedule-detail.html?" + query.toString();
      }

      function routeStats(route) {
        var rows = schedules.filter(function (item) { return item.routeCode === route.routeCode; });
        var saleRows = rows.filter(function (item) { return item.status !== "已关闭"; });
        var next = saleRows.map(function (item) { return item.depart; }).sort()[0] || "暂无";
        var sold = rows.reduce(function (sum, item) { return sum + Number(item.caesarUsed || 0); }, 0);
        return { count: rows.length, saleCount: saleRows.length, next: next, sold: sold };
      }

      function renderSummary() {
        var totalCount = schedules.length;
        var saleCount = schedules.filter(function (item) { return item.status !== "已关闭"; }).length;
        var currentObjectName = objectName(profile.batchType || "普通团期");
        var nextDepart = schedules.filter(function (item) { return item.status !== "已关闭"; }).map(function (item) { return item.depart; }).sort()[0] || "暂无";
        var cover = document.getElementById("summaryProductCover");
        var status = document.getElementById("summaryProductStatus");
        var pageTitle = "产品供给安排";
        document.title = (profile.productTitle || profile.product || "产品") + " - " + pageTitle + " - 凯撒旅游";
        setText("productSchedulePageTitle", pageTitle);
        setText("openProductScheduleDrawer", "新建" + currentObjectName);
        setText("summaryProductCode", profile.productCode || "-");
        setText("summaryProductName", profile.productTitle || profile.product || "-");
        setText("summaryProductMeta", [profile.type || "", profile.travelType || ""].filter(Boolean).join(" · "));
        setText("summaryProductType", profile.type || "-");
        setText("summaryTravelType", profile.travelType || "-");
        setText("summarySubjectCompany", "已采用");
        setText("summaryOwnerOrg", ownerOrgFor(profile));
        setText("summaryDestination", profile.destination || "-");
        setText("summaryDeparture", profile.departure || "-");
        setText("summarySaleCount", saleCount);
        setText("summarySaleObject", "个安排");
        setText("summaryRouteScheduleStats", routes.length + "条线路 / 共" + totalCount + "个供给安排");
        setText("summaryOwnerLine", "凯撒对接 " + ownerOrgFor(profile) + " · 最近出发 " + nextDepart);
        if (cover) {
          cover.src = productCoverUrl(profile);
          cover.alt = (profile.productTitle || profile.product || "产品") + "封面";
        }
        if (status) {
          status.textContent = saleCount ? "已采用" : "待维护";
          status.className = saleCount ? "tag tag-green" : "tag tag-gray";
        }
        setText("scheduleCodeHead", currentObjectName + "编号");
        document.getElementById("scheduleKeyword").placeholder = currentObjectName + "编号/线路名称";
        document.getElementById("openProductScheduleDrawer").setAttribute("data-drawer-title", "新建" + currentObjectName);
        document.getElementById("productScheduleDetailLink").href = "product-detail.html?productName=" + encodeURIComponent(profile.product || productNameParam) + "&type=" + encodeURIComponent(profile.typeKey || typeParam);
      }

      function renderRoutes() {
        var routeHtml = [];
        routes.forEach(function (route) {
          var stats = routeStats(route);
          routeHtml.push([
            '<button class="product-schedule-route-card' + (activeRoute === route.route ? ' active' : '') + '" type="button" data-route-filter="' + escapeHtml(route.route) + '">',
            '  <strong>' + escapeHtml(route.route) + '</strong>',
            '  <span>' + escapeHtml(stats.saleCount + '个可用' + objectName(route.batchType) + ' / 凯撒占用' + stats.sold + route.unit) + '</span>',
            '  <em>最近 ' + escapeHtml(stats.next) + '</em>',
            '</button>'
          ].join(""));
        });
        document.getElementById("productScheduleRoutes").innerHTML = routeHtml.join("");
      }

      function filteredSchedules() {
        var keyword = document.getElementById("scheduleKeyword").value.trim().toLowerCase();
        var status = document.getElementById("scheduleStatusFilter").value;
        var month = document.getElementById("scheduleDepartMonth").value;
        var hideStopped = document.getElementById("hideStoppedSchedules").checked;
        return schedules.filter(function (item) {
          if (activeRoute !== "__all" && item.route !== activeRoute) return false;
          if (keyword && [item.code, item.route, item.product].join(" ").toLowerCase().indexOf(keyword) < 0) return false;
          if (status && item.status !== status) return false;
          if (month && item.depart.slice(0, 7) !== month) return false;
          if (hideStopped && item.status === "已关闭") return false;
          return true;
        });
      }

      function renderRows() {
        var rows = filteredSchedules();
        var tbody = document.getElementById("productScheduleRows");
        tbody.innerHTML = rows.map(function (item) {
          var left = supplyLeft(item);
          var caesarStatus = displayCaesarStatus(item.execution);
          var closeText = item.status === "已关闭" ? "恢复供给" : "关闭供给";
          var impactHtml = item.priceImpact === "已确认订单需补差" ? '<span class="tag tag-blue">需补差</span>' : "";
          return [
            '<tr data-schedule-code="' + escapeHtml(item.code) + '">',
            '  <td><div class="table-cell-main"><strong>' + escapeHtml(item.code) + '</strong><span>' + escapeHtml(objectName(item.batchType)) + '</span></div></td>',
            '  <td><div class="table-cell-main"><strong>' + escapeHtml(item.route) + '</strong><span>' + escapeHtml(item.productTitle || item.product) + '</span></div></td>',
            '  <td><div class="table-cell-main"><strong>' + escapeHtml(item.depart) + '</strong><span>回团 ' + escapeHtml(item.back) + '</span></div></td>',
            '  <td><div class="supplier-supply-status-cell"><span class="' + statusClass(item.status) + '">' + escapeHtml(item.status) + '</span><strong>' + escapeHtml(item.confirmMode) + '</strong><em>保留 ' + escapeHtml(item.reserveHours || "4小时") + '</em></div></td>',
            '  <td><div class="table-cell-main"><strong>' + escapeHtml(String(left)) + '/' + escapeHtml(String(item.stock)) + escapeHtml(item.unit) + '</strong><span>凯撒占用 ' + escapeHtml(String(item.caesarUsed || 0)) + escapeHtml(item.unit) + (item.pendingUsed ? ' · 待确认' + escapeHtml(String(item.pendingUsed)) + escapeHtml(item.unit) : '') + '</span></div></td>',
            '  <td><div class="supplier-supply-price-cell"><strong>结算 ' + escapeHtml(item.settlementPrice || item.price) + '</strong><span>公开参考 ' + escapeHtml(item.publicPrice || publicPriceBySettlement(item.settlementPrice || item.price)) + '</span>' + impactHtml + '</div></td>',
            '  <td><div class="supplier-supply-status-cell"><span class="' + statusClass(caesarStatus) + '">' + escapeHtml(caesarStatus) + '</span><strong>报名 ' + escapeHtml(item.deadline) + '</strong><em>报价有效至 ' + escapeHtml(item.priceValidUntil || "-") + '</em></div></td>',
            '  <td><div class="table-action"><button class="table-action-primary" type="button" data-open-inventory>余位</button><button type="button" data-open-price>报价</button><span class="dropdown table-action-more"><button class="muted table-more-toggle" type="button" data-row-more aria-expanded="false">更多</button><span class="dropdown-menu action-dropdown-menu"><a class="dropdown-item" href="' + escapeHtml(detailHref(item)) + '">详情</a><button class="dropdown-item" type="button" data-toggle-schedule>' + escapeHtml(closeText) + '</button></span></span></div></td>',
            '</tr>'
          ].join("");
        }).join("");
        if (!rows.length) {
          var currentObjectName = objectName(profile.batchType || "普通团期");
          tbody.innerHTML = '<tr><td colspan="8" class="text-muted">当前线路暂无供给安排，可点击右上角新建' + escapeHtml(currentObjectName) + '。</td></tr>';
        }
        document.getElementById("productSchedulePager").textContent = rows.length + " 条";
        renderRoutes();
      }

      var scheduleDrawer = null;

      function drawerProducts() {
        return routes.map(function (route) {
          var firstSchedule = route.schedules && route.schedules[0];
          return {
            code: route.routeCode || route.productCode,
            product: route.productTitle || route.product || productNameParam,
            productCode: route.productCode,
            typeKey: route.typeKey || typeParam || "group",
            productType: route.type,
            batchType: route.batchType,
            route: route.route,
            routeOptions: routes.filter(function (item) {
              return item.product === route.product || item.productTitle === route.productTitle;
            }).map(function (item) {
              return item.route;
            }),
            unit: route.unit,
            capacity: route.defaultCapacity || Number(firstSchedule && firstSchedule[4]) || 20,
            price: firstSchedule && firstSchedule[6] || "¥0",
            destination: route.destination,
            days: route.days || 8,
            meta: [route.departure, route.travelType].filter(Boolean).join(" / "),
            ownerOrg: route.ownerOrg || ownerOrgFor(route)
          };
        });
      }

      function initScheduleDrawer() {
        if (scheduleDrawer) return scheduleDrawer;
        if (!window.caesarSupplierScheduleDrawer) return null;
        scheduleDrawer = window.caesarSupplierScheduleDrawer.init({
          mount: document.body,
          products: drawerProducts(),
          onSubmitted: function (items) {
            items.slice().reverse().forEach(function (item) {
              var matchedRoute = routes.find(function (route) { return route.route === item.route; }) || routes[0] || profile;
              schedules.unshift(Object.assign({}, item, {
                route: item.route || (matchedRoute && matchedRoute.route) || activeRoute,
                product: (matchedRoute && matchedRoute.product) || item.product,
                productTitle: (matchedRoute && matchedRoute.productTitle) || item.product,
                type: (matchedRoute && matchedRoute.type) || profile.type,
                typeKey: (matchedRoute && matchedRoute.typeKey) || item.typeKey || profile.typeKey,
                batchType: (matchedRoute && matchedRoute.batchType) || item.batchType || profile.batchType,
                routeCode: (matchedRoute && matchedRoute.routeCode) || item.routeCode || profile.productCode || "",
                company: (matchedRoute && matchedRoute.company) || profile.company || "凯撒外采",
                ownerOrg: (matchedRoute && matchedRoute.ownerOrg) || ownerOrgFor(matchedRoute),
                caesarUsed: Number(item.caesarUsed || item.sold || 0),
                pendingUsed: Number(item.pendingUsed || 0),
                left: Math.max(Number(item.stock || 0) - Number(item.caesarUsed || item.sold || 0), 0),
                status: normalizeSupplyStatus(item.status, item.stock, item.caesarUsed || item.sold),
                confirmMode: normalizeConfirmMode(item.confirmMode, item.typeKey || (matchedRoute && matchedRoute.typeKey)),
                reserveHours: item.reserveHours || "4小时",
                priceValidUntil: item.priceValidUntil || "2026-08-31",
                priceImpact: item.priceImpact || "不影响",
                priceItems: item.priceItems || priceItemDefaults(item.settlementPrice || item.price, item.publicPrice, item.typeKey || (matchedRoute && matchedRoute.typeKey))
              }));
            });
            if (items.length) {
              activeRoute = items[0].route || activeRoute;
              renderSummary();
              renderRows();
            }
          }
        });
        return scheduleDrawer;
      }

      function openScheduleDrawer(routeName, options) {
        var targetRoute = routes.find(function (route) { return route.route === routeName; }) || routes[0] || profile;
        var drawer = initScheduleDrawer();
        if (!drawer) return;
        drawer.open(Object.assign({
          product: targetRoute.productTitle || targetRoute.product || profile.product || productNameParam,
          route: routeName !== "__all" ? routeName : (targetRoute.route || ""),
          type: targetRoute.typeKey || profile.typeKey || typeParam,
          title: "新建" + objectName(targetRoute.batchType || profile.batchType || "普通团期"),
          prefill: true
        }, options || {}));
      }

      var inventoryDrawer = document.getElementById("supplyInventoryDrawer");
      var priceDrawer = document.getElementById("supplyPriceDrawer");
      var activeSupplyCode = "";

      function openLayer(layer) {
        layer.hidden = false;
        layer.classList.remove("closing");
        layer.setAttribute("aria-hidden", "false");
        window.requestAnimationFrame(function () { layer.classList.add("show"); });
      }

      function closeLayer(layer) {
        layer.classList.remove("show");
        layer.classList.add("closing");
        window.setTimeout(function () {
          layer.classList.remove("closing");
          layer.hidden = true;
          layer.setAttribute("aria-hidden", "true");
        }, 260);
      }

      function toast(message, type) {
        if (window.caesarUI && window.caesarUI.toast) window.caesarUI.toast(message, type ? { type: type } : undefined);
      }

      function findSchedule(code) {
        return schedules.find(function (item) { return item.code === code; }) || schedules[0];
      }

      function description(items) {
        return items.map(function (item) {
          return '<div class="description-item"><div class="description-label">' + escapeHtml(item[0]) + '</div><div class="description-value">' + item[1] + '</div></div>';
        }).join("");
      }

      function scheduleSummary(item) {
        return description([
          ["安排编号", escapeHtml(item.code)],
          ["产品/线路", escapeHtml((item.productTitle || item.product) + " / " + item.route)],
          ["出发/回团", escapeHtml(item.depart + " / " + item.back)],
          ["凯撒承接", '<span class="' + statusClass(displayCaesarStatus(item.execution)) + '">' + escapeHtml(displayCaesarStatus(item.execution)) + '</span>']
        ]);
      }

      function openInventoryDrawer(code) {
        var item = findSchedule(code);
        activeSupplyCode = item.code;
        document.getElementById("supplyInventorySummary").innerHTML = scheduleSummary(item);
        document.getElementById("supplyStatusInput").value = item.status || "可售";
        document.getElementById("supplyConfirmModeInput").value = item.confirmMode || "每单确认";
        document.getElementById("supplyTotalInput").value = Number(item.stock || 0);
        document.getElementById("supplyLeftInput").value = supplyLeft(item);
        document.getElementById("supplyUsedInput").value = String(item.caesarUsed || 0) + item.unit;
        document.getElementById("supplyPendingInput").value = String(item.pendingUsed || 0) + item.unit;
        document.getElementById("supplyDeadlineInput").value = item.deadline || "";
        document.getElementById("supplyReserveInput").value = item.reserveHours || "4小时";
        document.getElementById("supplyInventoryReason").value = "";
        openLayer(inventoryDrawer);
      }

      function normalizedInventoryStatus(total, left, status) {
        if (status === "已关闭") return "已关闭";
        if (Number(left || 0) <= 0 && Number(total || 0) > 0) return "售罄";
        return status || "可售";
      }

      function applyInventoryValues(submit) {
        var item = findSchedule(activeSupplyCode);
        var total = Number(document.getElementById("supplyTotalInput").value || 0);
        var left = Number(document.getElementById("supplyLeftInput").value || 0);
        var status = document.getElementById("supplyStatusInput").value;
        if (left > total && total > 0) {
          toast("当前余位不能大于总可供数量", "warning");
          return false;
        }
        if (status === "已关闭" && !document.getElementById("supplyInventoryReason").value.trim()) {
          toast("关闭供给需要填写原因", "warning");
          return false;
        }
        item.stock = total;
        item.left = Math.max(left, 0);
        item.caesarUsed = Math.max(total - item.left, Number(item.caesarUsed || 0));
        item.status = normalizedInventoryStatus(total, left, status);
        item.confirmMode = document.getElementById("supplyConfirmModeInput").value;
        item.deadline = document.getElementById("supplyDeadlineInput").value;
        item.reserveHours = document.getElementById("supplyReserveInput").value;
        if (submit) item.execution = "余位变更";
        renderSummary();
        renderRows();
        closeLayer(inventoryDrawer);
        toast(submit ? "余位变更已提交凯撒确认" : "余位草稿已保存");
        return true;
      }

      function renderPriceRows(item) {
        var priceItems = item.priceItems && item.priceItems.length ? item.priceItems : priceItemDefaults(item.settlementPrice, item.publicPrice, item.typeKey);
        item.priceItems = priceItems;
        document.getElementById("supplyPriceRows").innerHTML = priceItems.map(function (priceItem, index) {
          return [
            '<tr>',
            '<td><strong>' + escapeHtml(priceItem.name) + '</strong></td>',
            '<td><input class="table-input" type="number" min="0" value="' + escapeHtml(priceItem.settlement || 0) + '" data-supply-price-index="' + index + '" data-supply-price-field="settlement"></td>',
            '<td><input class="table-input" type="number" min="0" value="' + escapeHtml(priceItem.public || 0) + '" data-supply-price-index="' + index + '" data-supply-price-field="public"></td>',
            '</tr>'
          ].join("");
        }).join("");
      }

      function openPriceDrawer(code) {
        var item = findSchedule(code);
        activeSupplyCode = item.code;
        document.getElementById("supplyPriceSummary").innerHTML = scheduleSummary(item);
        document.getElementById("supplyPriceValidInput").value = item.priceValidUntil || "2026-08-31";
        document.getElementById("supplyPriceImpactInput").value = item.priceImpact || "不影响";
        document.getElementById("supplyPriceReason").value = "";
        renderPriceRows(item);
        openLayer(priceDrawer);
      }

      function applyPriceValues(submit) {
        var item = findSchedule(activeSupplyCode);
        var nextItems = (item.priceItems || []).map(function (priceItem) {
          return Object.assign({}, priceItem);
        });
        Array.prototype.forEach.call(document.querySelectorAll("[data-supply-price-index]"), function (input) {
          var index = Number(input.dataset.supplyPriceIndex);
          var field = input.dataset.supplyPriceField;
          if (!nextItems[index]) return;
          nextItems[index][field] = Number(input.value || 0);
        });
        var missing = nextItems.some(function (row) { return row.settlement == null || row.public == null; });
        if (missing) {
          toast("请补齐供应商结算价和公开价", "warning");
          return false;
        }
        item.priceItems = nextItems;
        item.settlementPrice = formattedPrice(nextItems[0] && nextItems[0].settlement || 0);
        item.publicPrice = formattedPrice(nextItems[0] && nextItems[0].public || 0);
        item.price = item.settlementPrice;
        item.priceValidUntil = document.getElementById("supplyPriceValidInput").value;
        item.priceImpact = document.getElementById("supplyPriceImpactInput").value;
        if (submit) item.execution = "价格变更";
        renderSummary();
        renderRows();
        closeLayer(priceDrawer);
        toast(submit ? "报价变更已提交凯撒确认" : "报价草稿已保存");
        return true;
      }

      document.getElementById("openProductScheduleDrawer").addEventListener("click", function () {
        openScheduleDrawer(activeRoute);
      });

      document.getElementById("productScheduleRoutes").addEventListener("click", function (event) {
        var card = event.target.closest("[data-route-filter]");
        if (!card) return;
        activeRoute = activeRoute === card.dataset.routeFilter ? "__all" : card.dataset.routeFilter;
        renderRows();
      });

      ["scheduleKeyword", "scheduleStatusFilter", "scheduleDepartMonth", "hideStoppedSchedules"].forEach(function (id) {
        document.getElementById(id).addEventListener("input", renderRows);
        document.getElementById(id).addEventListener("change", renderRows);
      });

      document.getElementById("resetProductScheduleFilters").addEventListener("click", function () {
        document.getElementById("scheduleKeyword").value = "";
        document.getElementById("scheduleStatusFilter").value = "";
        document.getElementById("scheduleDepartMonth").value = "";
        document.getElementById("hideStoppedSchedules").checked = true;
        renderRows();
      });

      document.getElementById("productScheduleRows").addEventListener("click", function (event) {
        var row = event.target.closest("tr[data-schedule-code]");
        if (!row) return;
        var item = schedules.find(function (schedule) { return schedule.code === row.dataset.scheduleCode; });
        if (!item) return;
        if (event.target.closest("[data-open-inventory]")) {
          openInventoryDrawer(item.code);
          return;
        }
        if (event.target.closest("[data-open-price]")) {
          openPriceDrawer(item.code);
          return;
        }
        if (event.target.closest("[data-toggle-schedule]")) {
          item.status = item.status === "已关闭" ? "需确认" : "已关闭";
          item.execution = "待凯撒确认";
          renderRows();
        }
      });

      document.querySelectorAll("[data-close-supply-inventory]").forEach(function (button) {
        button.addEventListener("click", function () { closeLayer(inventoryDrawer); });
      });
      document.querySelectorAll("[data-close-supply-price]").forEach(function (button) {
        button.addEventListener("click", function () { closeLayer(priceDrawer); });
      });
      inventoryDrawer.addEventListener("click", function (event) {
        if (event.target === inventoryDrawer) closeLayer(inventoryDrawer);
      });
      priceDrawer.addEventListener("click", function (event) {
        if (event.target === priceDrawer) closeLayer(priceDrawer);
      });
      document.getElementById("saveSupplyInventoryDraft").addEventListener("click", function () { applyInventoryValues(false); });
      document.getElementById("submitSupplyInventory").addEventListener("click", function () { applyInventoryValues(true); });
      document.getElementById("saveSupplyPriceDraft").addEventListener("click", function () { applyPriceValues(false); });
      document.getElementById("submitSupplyPrice").addEventListener("click", function () { applyPriceValues(true); });

      renderSummary();
      renderRoutes();
      renderRows();
    })();
  </script>
</body>
</html>
