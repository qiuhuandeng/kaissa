<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>岗位管理 - 凯撒旅游</title>
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="../shared/price-field-permissions.css">
  <script src="../shared/price-field-permissions.js"></script>
</head>
<body>
  <script src="../shared/nav-admin.js"></script>

  <main class="position-admin-page">
    <section class="list-surface position-list-surface" data-list-surface>
      <h1 class="sr-only">岗位管理</h1>
      <section class="filter-card filter-card-compact list-surface-filter" aria-label="岗位筛选">
        <div class="list-surface-filter-layout">
          <div class="list-surface-filter-fields">
            <div class="filter-item">
              <input class="form-control" type="search" placeholder="搜索岗位名称/编码">
            </div>
            <div class="filter-item-sm">
              <select class="form-control" aria-label="岗位类别">
                <option>全部类别</option>
                <option>管理岗</option>
                <option>产品岗</option>
                <option>运营岗</option>
                <option>销售岗</option>
                <option>财务岗</option>
                <option>渠道岗</option>
              </select>
            </div>
            <div class="filter-item-sm">
              <select class="form-control" aria-label="适用层级">
                <option>全部层级</option>
                <option>集团</option>
                <option>产业板块</option>
                <option>主体公司</option>
                <option>中心</option>
                <option>部门/门店</option>
              </select>
            </div>
            <div class="filter-item-sm filter-item-status">
              <select class="form-control" aria-label="状态">
                <option>全部状态</option>
                <option>启用</option>
                <option>停用</option>
              </select>
            </div>
            <div class="filter-actions">
              <button class="btn btn-secondary btn-filter-search" type="button">搜索</button>
              <button class="btn btn-secondary" type="button">重置</button>
            </div>
          </div>
          <div class="filter-actions list-surface-filter-actions list-filter-pinned-actions">
            <button class="btn btn-secondary" type="button" data-open-position-sync>同步设置</button>
            <button class="btn btn-secondary" type="button">立即同步</button>
            <button class="btn btn-primary" type="button" data-open-position-drawer>新增岗位</button>
          </div>
        </div>
      </section>

      <div class="table-wrap position-table-wrap list-surface-table list-table-with-pagination">
        <table>
          <colgroup><col><col style="width:100px"><col style="width:128px"><col style="width:170px"><col style="width:80px"><col class="pf-position-actions"></colgroup>
          <thead><tr><th>岗位名称</th><th>岗位类别</th><th>适用层级</th><th>业务角色</th><th>状态</th><th class="pf-position-actions">操作</th></tr></thead>
          <tbody id="positionRows"></tbody>
        </table>
      </div>

      <p id="positionNotice" class="pf-notice" role="status"></p>
      <div class="pagination list-surface-pagination list-pagination-attached">
        <span id="positionCount"></span>
      </div>
    </section>
  </main>

  <div class="modal-overlay drawer-overlay" aria-hidden="true" data-position-drawer>
    <div class="modal drawer-modal position-drawer" role="dialog" aria-modal="true" aria-labelledby="positionDrawerTitle">
      <div class="modal-header">
        <div class="modal-title" id="positionDrawerTitle">编辑岗位</div>
        <button class="modal-close" type="button" aria-label="关闭" data-close-position-drawer>&times;</button>
      </div>
      <form id="positionForm">
        <div class="modal-body">
          <p id="positionError" class="pf-error" role="alert"></p>
          <nav class="tab-bar drawer-tab-bar" aria-label="岗位设置"><button type="button" class="tab-item active" data-position-tab="base">基本资料</button><button type="button" class="tab-item" data-position-tab="fields">可见字段</button></nav>
          <section data-position-panel="base">
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="positionCode">岗位编码</label>
              <input class="form-control" id="positionCode" type="text" readonly>
            </div>
            <div class="form-group">
              <label class="form-label" for="positionName">岗位名称</label>
              <input class="form-control" id="positionName" type="text" value="产品经理">
            </div>
            <div class="form-group">
              <label class="form-label" for="positionType">岗位类别</label>
              <select class="form-control" id="positionType">
                <option>管理岗</option>
                <option selected>产品岗</option>
                <option>运营岗</option>
                <option>销售岗</option>
                <option>财务岗</option>
                <option>渠道岗</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="positionLevel">适用层级</label>
              <select class="form-control" id="positionLevel">
                <option>集团</option>
                <option>产业板块</option>
                <option>主体公司</option>
                <option>中心</option>
                <option selected>部门/门店</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="positionSalary">薪资参考</label>
              <input class="form-control" id="positionSalary" type="text" value="¥12,000-20,000">
            </div>
            <div class="form-group">
              <label class="form-label" for="positionSource">同步来源</label>
              <select class="form-control" id="positionSource">
                <option selected>手动维护</option>
                <option>旧HR同步</option>
                <option>企微通讯录</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="positionStatus">状态</label>
              <select class="form-control" id="positionStatus">
                <option selected>启用</option>
                <option>停用</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="positionSort">排序</label>
              <input class="form-control" id="positionSort" type="number" value="40">
            </div>
            <div class="form-group form-group-full">
              <label class="form-label" for="positionDuty">岗位职责说明</label>
              <textarea class="form-control" id="positionDuty" rows="4">负责欧洲线、自营产品与代理产品的产品资料维护、价格策略配置、产品发布前协同审批。</textarea>
            </div>
          </div>
          </section>
          <section data-position-panel="fields" hidden>
            <div class="form-group"><label class="form-label" for="positionRole">关联业务角色</label><select class="form-control" id="positionRole"></select></div>
            <p id="positionRoleScope" class="text-muted pf-scope"></p>
            <div id="positionFieldEditor"></div>
            <p id="positionRoleUsage" class="form-hint"></p>
          </section>
        </div>
        <div class="modal-footer position-drawer-footer">
          <button class="btn btn-secondary" type="button" data-close-position-drawer>取消</button>
          <button class="btn btn-primary" type="submit" id="positionSave">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" aria-hidden="true" data-position-sync-modal>
    <div class="modal modal-md position-sync-modal" role="dialog" aria-modal="true" aria-labelledby="positionSyncTitle">
      <div class="modal-header">
        <div class="modal-title" id="positionSyncTitle">岗位同步设置</div>
        <button class="modal-close" type="button" aria-label="关闭" data-close-position-sync>&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label" for="positionSyncSource">数据来源</label>
            <select class="form-control" id="positionSyncSource">
              <option>旧HR系统</option>
              <option>企业微信通讯录</option>
              <option>手动维护优先</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="positionSyncFreq">同步频率</label>
            <select class="form-control" id="positionSyncFreq">
              <option>每日 02:00</option>
              <option>每 6 小时</option>
              <option>手动触发</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="positionConflict">冲突处理</label>
            <select class="form-control" id="positionConflict">
              <option>保留 admin 手动修改</option>
              <option>以来源系统覆盖</option>
              <option>产生待处理任务</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="positionDisableRule">停用策略</label>
            <select class="form-control" id="positionDisableRule">
              <option>来源停用后同步停用</option>
              <option>仅标记待确认</option>
              <option>不同步停用状态</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" type="button" data-close-position-sync>取消</button>
        <button class="btn btn-primary" type="button" data-close-position-sync>保存设置</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var positionDrawer = document.querySelector("[data-position-drawer]");
      var syncModal = document.querySelector("[data-position-sync-modal]");

      function openModal(modal) {
        if (!modal) return;
        modal.classList.add("show");
        modal.setAttribute("aria-hidden", "false");
      }

      function closeModal(modal) {
        if (!modal) return;
        modal.classList.remove("show");
        modal.setAttribute("aria-hidden", "true");
      }

      document.querySelectorAll("[data-open-position-sync]").forEach(function (button) {
        button.addEventListener("click", function () {
          openModal(syncModal);
        });
      });

      document.querySelectorAll("[data-close-position-sync]").forEach(function (button) {
        button.addEventListener("click", function () {
          closeModal(syncModal);
        });
      });
    })();
  </script>
  <script src="../shared/position-field-permissions.js"></script>
</body>
</html>
