<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>合同模板 - 凯撒旅游</title>
  <link rel="stylesheet" href="../shared/style.css">
  <script>
    const oldContractUrl = new URL(location.href);
    if (oldContractUrl.searchParams.get('tab') === 'rules') {
      oldContractUrl.pathname = oldContractUrl.pathname.replace(/contract-templates\.html$/, 'contract-rules.html');
      oldContractUrl.searchParams.delete('tab');
      location.replace(oldContractUrl.href);
    }
  </script>
</head>
<body>
  <script src="../shared/nav-admin.js"></script>
  <main>
    <div class="page-workbar"><h1 class="page-title">合同模板</h1></div>
    <section id="contractTemplatesPanel" class="contract-settings" data-cs-page="templates" aria-label="合同模板列表"></section>
  </main>
  <script src="../shared/contract-template-catalog.js"></script>
  <script src="../shared/contract-settings-data.js"></script>
  <script src="../shared/contract-template-text.js"></script>
  <script src="../shared/contract-template-fields.js"></script>
  <script src="../shared/contract-settings-ui.js"></script>
</body>
</html>
