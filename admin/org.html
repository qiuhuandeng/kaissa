<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>组织架构 - 凯撒旅游</title>
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="../shared/store-governance.css">
  <link rel="stylesheet" href="../shared/contract-settings.css">
  <script src="../shared/approval-org-data.js"></script>
</head>
<body>
  <script src="../shared/nav-admin.js"></script>

  <main class="org-admin-page org-control-page">
    <section class="org-admin-layout">
      <aside class="org-admin-tree-panel" aria-label="组织架构树">
        <div class="org-admin-panel-head">
          <h1 class="org-admin-panel-title">组织架构</h1>
          <button class="btn btn-primary org-add-icon" type="button" data-org-primary-action data-drawer-title="新建部门" aria-label="新建部门" title="新建部门">+</button>
        </div>

        <div class="org-admin-tree" data-org-tree></div>
      </aside>

      <section class="org-admin-detail-panel">
        <div class="org-admin-workbar org-members-heading">
          <h2 class="org-admin-panel-title" data-member-heading>员工列表</h2>
          <div class="aow-org-actions" data-org-actions></div>
        </div>
        <section class="org-admin-tab-panel active" data-org-panel="members" aria-label="员工列表"></section>
      </section>
    </section>
  </main>

  <script src="../shared/store-governance-model.js"></script>
  <script src="../shared/org-admin-ui.js"></script>
  <script src="../shared/org-appointment-form.js"></script>
  <script src="../shared/admin-org-members.js"></script>
  <script src="../shared/approval-org-workflow.js"></script>
  <script src="../shared/approval-org-workflow-ui.js"></script>
  <script src="../shared/admin-org-structure.js"></script>
</body>
</html>
