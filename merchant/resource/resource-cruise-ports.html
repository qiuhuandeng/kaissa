<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>港口 - 凯撒旅游</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <link rel="stylesheet" href="../../shared/cruise-resource-editor.css">
</head>
<body data-cruise-resource="ports">
  <script src="../../shared/nav-merchant.js"></script>
  <section class="list-surface resource-masterdata-list-surface cruise-resource-list" data-list-surface>
    <section class="filter-card filter-card-compact list-surface-filter" aria-label="港口筛选">
      <div class="list-surface-filter-actions list-filter-pinned-actions"><button class="btn btn-primary" type="button" data-open-port-drawer>新增港口</button></div>
      <div class="filter-row">
        <div class="filter-item"><label class="sr-only" for="portKeyword">港口名称、英文名或别名</label><input id="portKeyword" type="search" placeholder="港口名称、英文名或别名"></div>
        <div class="filter-item filter-item-sm"><label class="sr-only" for="portCountry">国家</label><select id="portCountry"><option value="">全部国家</option></select></div>
        <div class="filter-actions"><button class="btn btn-secondary btn-filter-search" type="button">搜索</button><button class="btn btn-secondary" type="button" data-cruise-reset>重置</button></div>
      </div>
    </section>
    <section class="table-wrap list-surface-table" aria-label="港口列表">
      <table><colgroup><col><col style="width:160px"><col style="width:180px"><col style="width:180px"><col style="width:120px"></colgroup><thead><tr><th>港口</th><th>国家／城市</th><th>别名</th><th>当地时区</th><th>操作</th></tr></thead><tbody></tbody></table>
    </section>
    <div class="pagination list-surface-pagination"><span data-cruise-count></span></div>
  </section>
  <div id="portDrawer" class="modal-overlay drawer-overlay" hidden>
    <section class="modal drawer-modal drawer-edit drawer-md resource-masterdata-drawer cruise-resource-drawer" role="dialog" aria-modal="true" aria-labelledby="portDrawerTitle">
      <div class="modal-header"><h2 id="portDrawerTitle" class="modal-title">港口维护</h2><button class="modal-close" type="button" data-close-port-drawer aria-label="关闭">×</button></div>
      <div class="modal-body"><section class="drawer-section"><h3 class="drawer-section-title">港口资料</h3><div class="form-grid" id="portFields"></div></section></div>
      <div class="modal-footer"><div class="drawer-footer-actions"><button class="btn btn-secondary" type="button" data-close-port-drawer>取消</button><button class="btn btn-primary" type="button" data-save-cruise-resource>保存</button></div></div>
    </section>
  </div>
  <script src="../../shared/cruise-resource-catalog.js"></script>
  <script src="../../shared/cruise-resource-editor.js"></script>
</body>
</html>
