<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>付款退回 - 凯撒旅游</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <link rel="stylesheet" href="../../shared/supplier-prepayment-return.css">

  <link rel="stylesheet" href="../../shared/payment-workspace.css">
  <script src="../../shared/payment-workspace.js"></script>
</head>
<body>
  <script src="../../shared/nav-merchant.js"></script>

  <section class="list-surface list-surface-tabbed finance-payment-return-list-surface" data-list-surface>
    <section class="filter-card filter-card-compact list-surface-filter" aria-label="付款退回筛选">
      <div class="list-surface-filter-actions list-filter-pinned-actions">
        <div class="btn-group">
          <button class="btn btn-primary" type="button" data-pm-register>登记到账</button>
          <button class="btn btn-secondary" type="button" data-export-return>导出</button>
        </div>
      </div>
      <div class="filter-row">
        <div class="filter-item">
          <label class="sr-only" for="returnKeyword">退回单/付款单/退回对象/流水/团期项目</label>
          <input id="returnKeyword" type="search" placeholder="退回单/付款单/退回对象/流水/团期项目">
        </div>
        <div class="filter-item-sm">
          <label class="sr-only" for="statusFilter">主状态</label>
          <select id="statusFilter"><option value="全部">全部状态</option><option>待到账</option><option>部分到账</option><option>已到账</option><option>已到账待匹配</option></select>
        </div>
        <div class="filter-item-wide filter-item-date-range">
          <label class="sr-only">退回日期</label>
          <div class="date-range">
            <input id="dateStart" type="date" value="" aria-label="开始日期">
            <span>至</span>
            <input id="dateEnd" type="date" value="" aria-label="结束日期">
          </div>
        </div>
        <div class="filter-actions">
          <button class="btn btn-secondary btn-filter-search" type="button" data-search-return>搜索</button>
          <button class="btn btn-secondary" type="button" data-reset-return>重置</button>
        </div>
      </div>
    </section>

    <section class="table-wrap finance-payment-return-table list-surface-table list-table-with-pagination" aria-label="付款退回列表">
      <table>
        <colgroup><col><col><col><col><col><col><col></colgroup>
        <thead><tr><th>退回单／性质</th><th>付款对象</th><th>原付款单</th><th>应退金额</th><th>已到账／未到账</th><th>资金状态</th><th class="sticky-action">操作</th></tr></thead>
        <tbody id="paymentReturnRows"></tbody>
      </table>
      <div id="paymentReturnPagination" class="table-pagination">第1-7条/共7条</div>
    </section>
  </section>

  <script src="../../shared/supplier-finance-model.js"></script>
  <script src="../../shared/supplier-finance-ui.js"></script>
  <script src="../../shared/supplier-prepayment-return-model.js"></script>
  <script src="../../shared/supplier-prepayment-return.js"></script>
  <script src="../../shared/payment-return-workbench-model.js"></script>
  <script src="../../shared/payment-return-seeds.js"></script>
  <script src="../../shared/payment-return-workbench.js"></script>
</body></html>
