<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公司间对账 - 凯撒旅游</title>
  <link rel="stylesheet" href="../../shared/style.css">
</head>
<body>
  <script src="../../shared/nav-merchant.js"></script>
  <main class="ic-rec-page">
    <section class="list-surface" aria-label="公司间对账">
        <div class="ic-rec-toolbar"><span>我方主体：<strong id="icCompany"></strong></span><button id="icCreate" type="button" class="btn btn-primary">发起对账</button></div>
      <section class="filter-card filter-card-compact list-surface-filter">
        <div id="icFilters" class="filter-row">
          <div class="filter-item"><label class="sr-only" for="icKeyword">对账单／关联订单</label><input id="icKeyword" type="search" placeholder="对账单／关联订单"></div>
          <div class="filter-item-sm"><label class="sr-only" for="icCounterparty">交易对方</label><select id="icCounterparty"><option value="">全部交易对方</option></select></div>
          <div class="filter-item-sm"><label class="sr-only" for="icKind">结算关系</label><select id="icKind"><option value="">全部结算关系</option><option value="purchase">采购／供货</option><option value="collection">代收</option><option value="commission">佣金</option></select></div>
          <div class="filter-item-sm"><label class="sr-only" for="icStatus">对账状态</label><select id="icStatus"><option value="">全部状态</option><option value="draft">草稿</option><option value="pending">待双方确认</option><option value="disputed">差异待处理</option><option value="confirmed">已对账</option><option value="void">已作废</option></select></div>
          <div class="filter-actions"><button id="icSearch" type="button" class="btn btn-secondary btn-filter-search">搜索</button><button id="icReset" type="button" class="btn btn-secondary">重置</button></div>
        </div>
      </section>
      <p id="icOrderScope" class="ic-rec-scope" hidden></p>
      <div class="table-wrap list-surface-table ic-rec-table">
        <table>
          <colgroup><col><col><col><col><col><col><col><col></colgroup>
          <thead><tr><th>对账单／关联订单</th><th>交易对方</th><th>结算金额</th><th>内部收付</th><th>差异（我方－对方）</th><th>双方确认</th><th>对账状态</th><th class="sticky-action">操作</th></tr></thead>
          <tbody id="icRows"></tbody>
        </table>
      </div>
      <div id="icCount" class="ic-rec-count"></div>
    </section>
  </main>
  <div id="icRecDrawer" class="modal-overlay drawer-overlay ic-rec-drawer" aria-hidden="true" hidden>
    <div class="modal drawer-modal drawer-xl" role="dialog" aria-modal="true" aria-labelledby="icDrawerTitle">
      <div class="modal-header"><div id="icDrawerTitle" class="modal-title">核对公司间账单</div><button class="modal-close" type="button" data-ic-close aria-label="关闭">×</button></div>
      <div class="modal-body"><div id="icDrawerContent"></div><p id="icError" class="ic-rec-error" role="alert" hidden></p><p id="icNotice" class="ic-rec-notice" role="status" hidden></p></div>
      <div id="icDrawerFooter" class="modal-footer"></div>
    </div>
  </div>
  <script src="../../shared/intercompany-reconciliation-model.js"></script>
  <script src="../../shared/intercompany-reconciliation.js"></script>
</body>
</html>
