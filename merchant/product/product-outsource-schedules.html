<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../../shared/style.css">
</head>
<body>
  <script src="../../shared/nav-merchant.js"></script>

  <main class="product-schedule-page outsource-schedule-page agency-pricing-page">
    <section class="page-workbar product-schedule-workbar">
      <div class="page-title-row">
        <a class="page-back-link" href="product-outsource-list.html">返回</a>
        <h1 class="page-title">代理安排定价</h1>
      </div>
      <div class="btn-group">
        <a id="outsourcePackageLink" class="btn btn-secondary" href="product-outsource-package.html">查看包装</a>
        <a id="outsourceProductDetailLink" class="btn btn-secondary" href="product-outsource-detail.html">代理产品详情</a>
      </div>
    </section>

    <section class="card product-schedule-hero agency-pricing-hero" aria-label="当前代理产品信息">
      <div class="product-schedule-info agency-pricing-info">
        <div class="route-blue-summary-head">
          <div class="route-hero-title-row route-hero-badges">
            <span class="route-code-pill">代理产品 <strong id="summarySourceCode">-</strong></span>
            <span id="summaryProductStatus" class="tag tag-blue">待开售</span>
            <span id="summaryProductTypeTag" class="tag tag-gray">代理产品</span>
          </div>
          <div id="summaryOwnerLine" class="route-eyebrow">-</div>
        </div>
        <h2 id="summaryProductName" class="route-hero-title">-</h2>
        <p id="summaryProductMeta" class="route-hero-desc">-</p>
        <div class="product-schedule-field-grid agency-pricing-field-grid">
          <div class="product-schedule-field"><span>来源供应商</span><strong id="summarySupplier">-</strong></div>
          <div class="product-schedule-field"><span>产品类型</span><strong id="summaryProductType">-</strong></div>
          <div class="product-schedule-field"><span>销售范围</span><strong id="summarySaleScope">-</strong></div>
          <div class="product-schedule-field"><span>包装状态</span><strong id="summaryPackageStatus">-</strong></div>
          <div class="product-schedule-field"><span>定价进度</span><strong id="summaryPricingProgress">-</strong></div>
          <div class="product-schedule-field"><span>可售安排</span><strong id="summaryArrangementTotal">-</strong></div>
        </div>
        <div class="product-schedule-context">
          <div class="product-schedule-sale-metric">
            <span>待处理</span>
            <div><strong id="summaryPendingCount">0</strong><em id="summaryPendingObject">个安排</em></div>
          </div>
          <div id="summaryScheduleStats" class="product-schedule-context-stat">-</div>
        </div>
      </div>
    </section>

    <section class="product-schedule-route-section" aria-label="代理产品线路">
      <div id="outsourceScheduleRoutes" class="product-schedule-route-grid"></div>
    </section>

    <section class="list-surface product-schedule-table-surface agency-pricing-surface" data-list-surface>
      <div class="list-surface-tabs list-function-tabs agency-pricing-tabs" role="tablist" aria-label="定价状态">
        <button class="tab-item active" type="button" data-price-status-tab="" aria-selected="true"><span class="list-tab-label">全部</span></button>
        <button class="tab-item" type="button" data-price-status-tab="待定价" aria-selected="false"><span class="list-tab-label">待定价</span></button>
        <button class="tab-item" type="button" data-price-status-tab="待提交" aria-selected="false"><span class="list-tab-label">待提交</span></button>
        <button class="tab-item" type="button" data-price-status-tab="审核中" aria-selected="false"><span class="list-tab-label">审核中</span></button>
        <button class="tab-item" type="button" data-price-status-tab="已生效" aria-selected="false"><span class="list-tab-label">已生效</span></button>
      </div>

      <section class="filter-card filter-card-compact product-schedule-filter-surface list-surface-filter" aria-label="代理安排筛选">
        <div class="filter-row">
          <div class="filter-item filter-item-search product-schedule-filter-keyword">
            <label class="sr-only" for="scheduleKeyword">安排编号/线路名称</label>
            <input id="scheduleKeyword" type="text" placeholder="安排编号/线路名称">
          </div>
          <label class="filter-check"><input id="hideStoppedSchedules" type="checkbox" checked> 隐藏停售安排</label>
          <div class="filter-actions">
            <button id="resetScheduleFilters" class="btn btn-secondary" type="button">重置</button>
          </div>
        </div>
      </section>

      <section class="table-wrap list-surface-table list-table-with-pagination product-schedule-table-wrap" aria-label="代理安排定价列表">
        <table class="product-schedule-table agency-product-schedule-table">
          <colgroup>
            <col class="agency-schedule-col-code">
            <col class="agency-schedule-col-route">
            <col class="agency-schedule-col-date">
            <col class="agency-schedule-col-stock">
            <col class="agency-schedule-col-settlement">
            <col class="agency-schedule-col-public">
            <col class="agency-schedule-col-price">
            <col class="agency-schedule-col-lock">
            <col class="agency-schedule-col-action">
          </colgroup>
          <thead>
            <tr>
              <th id="scheduleCodeHead">代理安排</th>
              <th>使用线路</th>
              <th>出发/返回</th>
              <th>名额/确认</th>
              <th>供应商结算价</th>
              <th>供应商公开价</th>
              <th>我方对客销售价</th>
              <th>定价状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="productScheduleRows"></tbody>
        </table>
      </section>
      <div class="pagination list-surface-pagination list-pagination-attached">
        <span id="productSchedulePager">0条</span>
      </div>
    </section>
  </main>

  <div id="schedulePriceDrawer" class="modal-overlay drawer-overlay" aria-hidden="true">
    <div class="modal drawer-modal outsource-product-modal outsource-price-modal" role="dialog" aria-modal="true" aria-labelledby="schedulePriceTitle">
      <div class="modal-header">
        <div id="schedulePriceTitle" class="modal-title">定价</div>
        <button class="modal-close" type="button" data-close-price aria-label="关闭">×</button>
      </div>
      <div class="modal-body">
        <section class="drawer-section">
          <div class="drawer-section-head">
            <h3 class="drawer-section-title">代理安排</h3>
          </div>
          <div id="schedulePriceSummary" class="description-grid"></div>
        </section>
        <section class="drawer-section">
          <div class="drawer-section-head">
            <h3 class="drawer-section-title">价格结构</h3>
          </div>
          <div class="table-wrap product-outsource-drawer-table drawer-table-fit drawer-table-cols-4">
            <table class="outsource-price-matrix-table">
              <colgroup>
                <col class="outsource-price-col-item">
                <col class="outsource-price-col-settlement">
                <col class="outsource-price-col-public">
                <col class="outsource-price-col-sale">
              </colgroup>
              <thead><tr><th>价格结构</th><th>供应商结算价</th><th>供应商公开价</th><th>我方对客销售价</th></tr></thead>
              <tbody id="schedulePriceMatrixRows"></tbody>
            </table>
          </div>
          <div id="schedulePriceWarning" class="outsource-price-warning" hidden></div>
          <div class="form-grid outsource-price-reason-grid">
            <div class="form-group form-group-full">
              <label id="schedulePriceRemarkLabel" class="form-label" for="schedulePriceRemark">定价原因</label>
              <textarea id="schedulePriceRemark" class="form-control" rows="3"></textarea>
            </div>
          </div>
        </section>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" type="button" data-close-price>取消</button>
        <button id="saveSchedulePrice" class="btn btn-secondary" type="button">保存草稿</button>
        <button id="submitSchedulePriceReview" class="btn btn-primary" type="button">提交定价审核</button>
      </div>
    </div>
  </div>

  <div id="scheduleDetailDrawer" class="modal-overlay drawer-overlay" aria-hidden="true">
    <div class="modal drawer-modal outsource-schedule-detail-drawer" role="dialog" aria-modal="true" aria-labelledby="scheduleDetailTitle">
      <div class="modal-header">
        <div id="scheduleDetailTitle" class="modal-title">代理安排详情</div>
        <button class="modal-close" type="button" data-close-detail aria-label="关闭">×</button>
      </div>
      <div class="modal-body">
        <section class="drawer-section">
          <div class="drawer-section-head">
            <h3 class="drawer-section-title">代理安排</h3>
          </div>
          <div id="scheduleDetailSummary" class="description-grid"></div>
        </section>
        <section class="drawer-section">
          <div class="drawer-section-head">
            <h3 class="drawer-section-title">订单占用</h3>
          </div>
          <div class="table-wrap product-outsource-drawer-table drawer-table-fit drawer-table-cols-4">
            <table>
              <thead><tr><th>订单号</th><th>客户/渠道</th><th>占用</th><th>收款</th></tr></thead>
              <tbody id="scheduleOrderRows"></tbody>
            </table>
          </div>
        </section>
        <section class="drawer-section">
          <div class="drawer-section-head">
            <h3 class="drawer-section-title">操作记录</h3>
          </div>
          <div id="scheduleLogRows" class="timeline-list"></div>
        </section>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" type="button" data-close-detail>关闭</button>
      </div>
    </div>
  </div>

  <div id="stopScheduleModal" class="modal-overlay" aria-hidden="true">
    <div class="modal modal-sm modal-confirm outsource-stop-modal" role="dialog" aria-modal="true" aria-labelledby="stopScheduleTitle">
      <div class="modal-header">
        <div id="stopScheduleTitle" class="modal-title">停售安排</div>
        <button class="modal-close" type="button" data-close-stop aria-label="关闭">×</button>
      </div>
      <div class="modal-body">
        <div id="stopScheduleSummary" class="outsource-stop-summary"></div>
        <div class="form-group outsource-stop-reason"><label class="form-label" for="stopScheduleReason">停售原因</label><textarea id="stopScheduleReason" class="form-control" rows="3"></textarea></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" type="button" data-close-stop>取消</button>
        <button id="confirmStopSchedule" class="btn btn-warning" type="button">确认停售</button>
      </div>
    </div>
  </div>

            { no: 'AGY-EU-20260418-001', route: 'A线 西葡经典10天', routeMeta: '马德里/巴塞罗那/里斯本', depart: '2026-04-18', back: '2026-04-27', deadline: '2026-04-01', quota: 18, sold: 18, priceStatus: '已生效', status: '停售', confirm: '已确认', confirmNo: 'SUP-CFM-20260418-001', priceItems: [{ name: '成人', settlement: 7600, public: 11200, sale: 11600 }, { name: '儿童占床', settlement: 6800, public: 9800, sale: 10200 }, { name: '儿童不占床', settlement: 6100, public: 8800, sale: 9200 }, { name: '单房差', settlement: 2100, public: 2600, sale: 2800 }], orders: [['KS20260403018', '马宁 / 软件园门店', '2人', '已收款']], logs: [['2026-04-12 16:00', '团期销售结束后停售。']] },
            { no: 'AGY-EU-20260509-002', route: 'B线 西葡深度10天', routeMeta: '安达卢西亚与葡萄牙线', depart: '2026-05-09', back: '2026-05-18', deadline: '2026-04-25', quota: 14, sold: 14, priceStatus: '已生效', status: '停售', confirm: '已确认', confirmNo: 'SUP-CFM-20260509-002', priceItems: [{ name: '成人', settlement: 7600, public: 11200, sale: 11600 }, { name: '儿童占床', settlement: 6800, public: 9800, sale: 10200 }, { name: '儿童不占床', settlement: 6100, public: 8800, sale: 9200 }, { name: '单房差', settlement: 2100, public: 2600, sale: 2800 }], orders: [['KS20260419007', '陈雨 / 直营网点', '4人', '已收款']], logs: [['2026-05-01 09:20', '供应商余位关闭，团期停售。']] }
          ]
        }
      };
      var sourceMap = {
        'OUT-EU-0001': 'group',
        'OUT-JP-0005': 'jp',
        'OUT-CR-0006': 'cruise',
        'OUT-FT-0008': 'free',
        'OUT-EU-0012': 'offline'
      };
      var productKey = sourceMap[params.get('source')] || params.get('product') || 'group';
      var product = products[productKey] || products.group;

      function escapeHtml(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, function (char) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char];
        });
      }

      function money(value) {
        if (value == null || value === '') return '-';
        return '¥' + Number(value || 0).toLocaleString('zh-CN');
      }

      function toast(message) {
        if (window.caesarUI && window.caesarUI.toast) window.caesarUI.toast(message);
      }

      function openLayer(modal) {
        if (window.caesarUI && window.caesarUI.openLayer) window.caesarUI.openLayer(modal);
        modal.classList.add('show');
        modal.setAttribute('aria-hidden', 'false');
      }

      function closeLayer(modal) {
        if (window.caesarUI && window.caesarUI.closeLayer) window.caesarUI.closeLayer(modal);
        else modal.classList.remove('show');
        modal.setAttribute('aria-hidden', 'true');
      }

      function tagClass(status) {
        if (status === '销售中' || status === '已确认' || status === '已生效' || status === '已包装') return 'tag tag-green';
        if (status === '审核中') return 'tag tag-orange';
        if (status === '待定价' || status === '待提交' || status === '待开售' || status === '待确认' || status === '待包装') return 'tag tag-blue';
        if (status === '停售' || status === '已停售' || status === '已关闭') return 'tag tag-gray';
        return 'tag tag-gray';
      }

      function setText(id, value) {
        var el = document.getElementById(id);
        if (el) el.textContent = value;
      }

      function currentArrangementName() {
        return product.objectName || '安排';
      }

      function activePriceItems(item) {
        return item.priceItems || [];
      }

      function mainPriceItem(item) {
        return activePriceItems(item)[0] || {};
      }

      function priceCell(item, field, mode) {
        var priceItem = mainPriceItem(item);
        var value = priceItem[field];
        var cls = mode === 'public' ? 'agency-price-cell agency-price-cell-muted' : 'agency-price-cell';
        return [
          '<div class="' + cls + '">',
          '<strong>' + escapeHtml(money(value)) + '</strong>',
          '<span>' + escapeHtml(priceItem.name || '-') + (mode === 'public' ? ' · 公开参考' : '') + '</span>',
          '</div>'
        ].join('');
      }

      function salePriceCell(item) {
        if (item.priceStatus === '待定价') {
          return '<div class="agency-price-cell"><strong>待定价</strong><span>需维护我方对客销售价</span></div>';
        }
        return priceCell(item, 'sale', 'sale');
      }

      function priceProgress() {
        var total = product.schedules.length;
        var effective = product.schedules.filter(function (item) { return item.priceStatus === '已生效'; }).length;
        var reviewing = product.schedules.filter(function (item) { return item.priceStatus === '审核中'; }).length;
        return effective + '/' + total + '已生效' + (reviewing ? ' · ' + reviewing + '个审核中' : '');
      }

      function pendingCount() {
        return product.schedules.filter(function (item) {
          return item.priceStatus !== '已生效';
        }).length;
      }

      function saleCount() {
        return product.schedules.filter(function (item) { return item.status === '销售中'; }).length;
      }

      function routeStats(route) {
        var list = product.schedules.filter(function (item) { return item.route === route.name; });
        var pending = list.filter(function (item) { return item.priceStatus !== '已生效'; }).length;
        var sold = list.reduce(function (sum, item) { return sum + Number(item.sold || 0); }, 0);
        var nextDepart = list.map(function (item) { return item.depart; }).sort()[0] || '暂无';
        return { total: list.length, pending: pending, sold: sold, nextDepart: nextDepart };
      }

      function renderRoutes() {
        var routeList = product.routes || [];
        document.getElementById('outsourceScheduleRoutes').innerHTML = routeList.map(function (route) {
          var stats = routeStats(route);
          return [
            '<button class="product-schedule-route-card' + (activeRoute === route.name ? ' active' : '') + '" type="button" data-route-filter="' + escapeHtml(route.name) + '">',
            '<strong>' + escapeHtml(route.name) + '</strong>',
            '<span>' + escapeHtml(stats.total + '个' + currentArrangementName() + ' / ' + stats.pending + '个待处理') + '</span>',
            '<em>已售' + escapeHtml(stats.sold + product.unit) + ' · 最近 ' + escapeHtml(stats.nextDepart) + '</em>',
            '</button>'
          ].join('');
        }).join('');
      }

      function renderSummary() {
        document.title = product.name + ' - 代理安排定价 - 凯撒旅游';
        document.getElementById('outsourceProductDetailLink').href = product.detailHref;
        document.getElementById('outsourcePackageLink').href = product.packageHref;
        setText('summarySourceCode', product.sourceCode);
        setText('summaryProductName', product.name);
        setText('summaryProductMeta', '供应商原产品：' + product.sourceProduct);
        setText('summarySupplier', product.supplier);
        setText('summaryProductType', product.type);
        setText('summarySaleScope', product.scope);
        setText('summaryPackageStatus', product.packageStatus);
        setText('summaryPricingProgress', priceProgress());
        setText('summaryArrangementTotal', product.schedules.length + '个' + currentArrangementName());
        setText('summaryPendingCount', pendingCount());
        setText('summaryPendingObject', '个待处理');
        setText('summaryScheduleStats', saleCount() + '个已销售开放 / 共' + product.schedules.length + '个' + currentArrangementName() + ' / ' + priceProgress());
        setText('summaryOwnerLine', '负责人 ' + product.owner);
        setText('scheduleCodeHead', '代理' + currentArrangementName());
        document.getElementById('summaryProductStatus').textContent = product.status;
        document.getElementById('summaryProductStatus').className = tagClass(product.status);
        document.getElementById('summaryProductTypeTag').textContent = product.type + '产品';
      }

      function filteredSchedules() {
        var keyword = document.getElementById('scheduleKeyword').value.trim().toLowerCase();
        var hideStopped = document.getElementById('hideStoppedSchedules').checked;
        return product.schedules.filter(function (item) {
          if (activeRoute !== '__all' && item.route !== activeRoute) return false;
          if (activePriceStatus && item.priceStatus !== activePriceStatus) return false;
          if (hideStopped && item.status === '停售') return false;
          if (keyword && [item.no, item.route, item.routeMeta, item.depart, item.back, product.name, product.sourceProduct].join(' ').toLowerCase().indexOf(keyword) < 0) return false;
          return true;
        });
      }

      function actionHtml(item) {
        var menu = [
          '<button class="dropdown-item" type="button" data-open-detail data-schedule-no="' + escapeHtml(item.no) + '">详情</button>'
        ];
        if (item.priceStatus === '审核中') {
          menu.push('<a class="dropdown-item" href="../approval/approval-product-review.html?kind=outsource_price&scheduleNo=' + encodeURIComponent(item.no) + '">查看审核</a>');
        }
        if (item.status === '停售') {
          menu.push('<button class="dropdown-item" type="button" data-restore-schedule data-schedule-no="' + escapeHtml(item.no) + '">恢复</button>');
        } else {
          menu.push('<button class="dropdown-item" type="button" data-open-stop data-schedule-no="' + escapeHtml(item.no) + '">停售</button>');
        }
        return [
          '<button class="table-action-primary" type="button" data-open-price data-schedule-no="' + escapeHtml(item.no) + '">定价</button>',
          '<span class="dropdown table-action-more"><button class="muted table-more-toggle" type="button" data-row-more aria-expanded="false">更多</button><span class="dropdown-menu action-dropdown-menu">',
          menu.join(''),
          '</span></span>'
        ].join('');
      }

      function renderRows() {
        var list = filteredSchedules();
        scheduleRows.innerHTML = list.map(function (item) {
          var left = Math.max(Number(item.quota || 0) - Number(item.sold || 0), 0);
          return [
            '<tr data-schedule-no="' + escapeHtml(item.no) + '">',
            '<td><div class="table-cell-main"><strong>' + escapeHtml(item.no) + '</strong><span>' + escapeHtml(product.name) + '</span></div></td>',
            '<td><div class="table-cell-main"><strong>' + escapeHtml(item.route || '-') + '</strong><span>' + escapeHtml(item.routeMeta || product.name) + '</span></div></td>',
            '<td><div class="table-cell-main"><strong>' + escapeHtml(item.depart + ' / ' + item.back) + '</strong><span>报名截止 ' + escapeHtml(item.deadline) + '</span></div></td>',
            '<td><div class="table-cell-main"><strong>' + escapeHtml(left + '/' + item.quota + product.unit) + '</strong><span>已售 ' + escapeHtml(item.sold + product.unit) + ' · ' + escapeHtml(item.confirm) + '</span></div></td>',
            '<td>' + priceCell(item, 'settlement', 'settlement') + '</td>',
            '<td>' + priceCell(item, 'public', 'public') + '</td>',
            '<td>' + salePriceCell(item) + '</td>',
            '<td><span class="' + tagClass(item.priceStatus) + '">' + escapeHtml(item.priceStatus) + '</span></td>',
            '<td><div class="table-action">' + actionHtml(item) + '</div></td>',
            '</tr>'
          ].join('');
        }).join('');
        if (!list.length) {
          scheduleRows.innerHTML = '<tr><td colspan="9" class="text-muted">当前条件下暂无代理安排</td></tr>';
        }
        document.getElementById('productSchedulePager').textContent = list.length + '条';
        renderRoutes();
        renderSummary();
      }

      function findSchedule(no) {
        return product.schedules.find(function (item) { return item.no === no; }) || product.schedules[0];
      }

      function description(items) {
        return items.map(function (item) {
          return '<div class="description-item"><div class="description-label">' + escapeHtml(item[0]) + '</div><div class="description-value">' + item[1] + '</div></div>';
        }).join('');
      }

      function scheduleSummary(item) {
        return description([
          ['代理安排', escapeHtml(item.no)],
          ['使用线路', escapeHtml(item.route)],
          ['出发/返回', escapeHtml(item.depart + ' / ' + item.back)],
          ['来源供应商', escapeHtml(product.supplier)],
          ['供应商确认', '<span class="' + tagClass(item.confirm) + '">' + escapeHtml(item.confirm) + '</span>'],
          ['定价状态', '<span class="' + tagClass(item.priceStatus) + '">' + escapeHtml(item.priceStatus) + '</span>']
        ]);
      }

      function stopScheduleSummary(item) {
        var left = Math.max(Number(item.quota || 0) - Number(item.sold || 0), 0);
        return [
          '<div class="outsource-stop-object">',
          '<strong>' + escapeHtml(item.no) + '</strong>',
          '<span>' + escapeHtml(product.name + ' · ' + item.depart + ' / ' + item.back) + '</span>',
          '</div>',
          '<div class="outsource-stop-metrics">',
          '<div><span>销售状态</span><strong><span class="' + tagClass(item.status) + '">' + escapeHtml(item.status) + '</span></strong></div>',
          '<div><span>定价状态</span><strong><span class="' + tagClass(item.priceStatus) + '">' + escapeHtml(item.priceStatus) + '</span></strong></div>',
          '<div><span>剩余/总名额</span><strong>' + escapeHtml(left + '/' + item.quota + product.unit) + '</strong></div>',
          '<div><span>供应商确认</span><strong><span class="' + tagClass(item.confirm) + '">' + escapeHtml(item.confirm) + '</span></strong></div>',
          '</div>'
        ].join('');
      }

      function renderPriceMatrix(item) {
        document.getElementById('schedulePriceMatrixRows').innerHTML = activePriceItems(item).map(function (priceItem, index) {
          var saleValue = priceItem.sale == null ? '' : Number(priceItem.sale || 0);
          return [
            '<tr>',
            '<td><strong>' + escapeHtml(priceItem.name) + '</strong></td>',
            '<td><span class="outsource-price-readonly">' + escapeHtml(money(priceItem.settlement)) + '</span></td>',
            '<td><span class="outsource-price-public">' + escapeHtml(money(priceItem.public)) + '</span></td>',
            '<td><input class="table-input" type="number" min="0" value="' + escapeHtml(saleValue) + '" data-price-item-value data-price-index="' + index + '" data-settlement="' + Number(priceItem.settlement || 0) + '" data-public="' + Number(priceItem.public || 0) + '"></td>',
            '</tr>'
          ].join('');
        }).join('');
      }

      function collectPriceValues() {
        var values = [];
        Array.prototype.forEach.call(document.querySelectorAll('[data-price-item-value]'), function (input) {
          var raw = input.value.trim();
          values.push({
            input: input,
            index: Number(input.dataset.priceIndex),
            value: raw === '' ? null : Number(raw),
            settlement: Number(input.dataset.settlement || 0),
            public: Number(input.dataset.public || 0)
          });
        });
        return values;
      }

      function applyPriceValues(item) {
        collectPriceValues().forEach(function (row) {
          if (!item.priceItems[row.index]) return;
          item.priceItems[row.index].sale = row.value;
        });
      }

      function validatePriceValues(requireAll) {
        var errors = [];
        collectPriceValues().forEach(function (row) {
          var label = document.querySelector('[data-price-index="' + row.index + '"]');
          var nameCell = label && label.closest('tr') && label.closest('tr').querySelector('td strong');
          var name = nameCell ? nameCell.textContent : '价格项';
          if (row.value == null || row.value <= 0) {
            if (requireAll) errors.push(name + '未填写我方对客销售价');
            return;
          }
          if (row.value < row.settlement) errors.push(name + '低于供应商结算价');
          if (row.value < row.public) errors.push(name + '低于供应商公开价');
        });
        return errors;
      }

      function showPriceWarning(messages) {
        var warning = document.getElementById('schedulePriceWarning');
        if (!messages.length) {
          warning.hidden = true;
          warning.innerHTML = '';
          return;
        }
        warning.hidden = false;
        warning.innerHTML = messages.map(function (message) {
          return '<span>' + escapeHtml(message) + '</span>';
        }).join('');
      }

      function openPrice(no) {
        var item = findSchedule(no);
        activeScheduleNo = item.no;
        document.getElementById('schedulePriceSummary').innerHTML = scheduleSummary(item);
        renderPriceMatrix(item);
        showPriceWarning([]);
        document.getElementById('submitSchedulePriceReview').textContent = item.priceStatus === '已生效' ? '提交改价审核' : '提交定价审核';
        document.getElementById('schedulePriceRemarkLabel').textContent = item.priceStatus === '已生效' ? '改价原因' : '定价原因';
        document.getElementById('schedulePriceRemark').value = '';
        openLayer(priceDrawer);
      }

      function openDetail(no) {
        var item = findSchedule(no);
        var main = mainPriceItem(item);
        document.getElementById('scheduleDetailSummary').innerHTML = scheduleSummary(item) + description([
          ['供应商结算价', escapeHtml(money(main.settlement))],
          ['供应商公开价', escapeHtml(money(main.public)) + ' 公开参考'],
          ['我方对客销售价', main.sale == null ? '待定价' : escapeHtml(money(main.sale))],
          ['名额/已售', escapeHtml(item.quota + product.unit + ' / 已售' + item.sold + product.unit)],
          ['报名截止', escapeHtml(item.deadline)]
        ]);
        document.getElementById('scheduleOrderRows').innerHTML = item.orders.length ? item.orders.map(function (row) {
          return '<tr><td>' + escapeHtml(row[0]) + '</td><td>' + escapeHtml(row[1]) + '</td><td>' + escapeHtml(row[2]) + '</td><td><span class="' + tagClass(row[3]) + '">' + escapeHtml(row[3]) + '</span></td></tr>';
        }).join('') : '<tr><td colspan="4" class="text-muted">暂无订单占用</td></tr>';
        document.getElementById('scheduleLogRows').innerHTML = item.logs.map(function (row) {
          return '<div class="timeline-item"><strong>' + escapeHtml(row[0]) + '</strong><span>' + escapeHtml(row[1]) + '</span></div>';
        }).join('');
        openLayer(detailDrawer);
      }

      function openStop(no) {
        var item = findSchedule(no);
        activeScheduleNo = item.no;
        document.getElementById('stopScheduleSummary').innerHTML = stopScheduleSummary(item);
        document.getElementById('stopScheduleReason').value = '';
        openLayer(stopScheduleModal);
      }

      function resetFilters() {
        document.getElementById('scheduleKeyword').value = '';
        document.getElementById('hideStoppedSchedules').checked = true;
        setActivePriceStatus('');
      }

      function setActivePriceStatus(status) {
        activePriceStatus = status || '';
        document.querySelectorAll('[data-price-status-tab]').forEach(function (button) {
          var matched = (button.dataset.priceStatusTab || '') === activePriceStatus;
          button.classList.toggle('active', matched);
          button.setAttribute('aria-selected', matched ? 'true' : 'false');
        });
        renderRows();
      }

      document.getElementById('scheduleKeyword').addEventListener('input', renderRows);
      document.getElementById('hideStoppedSchedules').addEventListener('change', renderRows);
      document.getElementById('resetScheduleFilters').addEventListener('click', resetFilters);
      document.querySelectorAll('[data-price-status-tab]').forEach(function (button) {
        button.addEventListener('click', function () {
          setActivePriceStatus(button.dataset.priceStatusTab || '');
        });
      });
      document.getElementById('outsourceScheduleRoutes').addEventListener('click', function (event) {
        var card = event.target.closest('[data-route-filter]');
        if (!card) return;
        activeRoute = activeRoute === card.dataset.routeFilter ? '__all' : card.dataset.routeFilter;
        renderRows();
      });
      document.addEventListener('click', function (event) {
        if (event.target.closest('[data-close-price]')) closeLayer(priceDrawer);
        if (event.target.closest('[data-close-detail]')) closeLayer(detailDrawer);
        if (event.target.closest('[data-close-stop]')) closeLayer(stopScheduleModal);
        var priceButton = event.target.closest('[data-open-price]');
        if (priceButton) openPrice(priceButton.dataset.scheduleNo);
        var detailButton = event.target.closest('[data-open-detail]');
        if (detailButton) openDetail(detailButton.dataset.scheduleNo);
        var stopButton = event.target.closest('[data-open-stop]');
        if (stopButton) openStop(stopButton.dataset.scheduleNo);
        var restoreButton = event.target.closest('[data-restore-schedule]');
        if (restoreButton) {
          findSchedule(restoreButton.dataset.scheduleNo).status = '待开售';
          renderRows();
          toast('安排已恢复到待开售');
        }
        if (event.target.classList.contains('modal-overlay')) closeLayer(event.target);
      });
      document.getElementById('saveSchedulePrice').addEventListener('click', function () {
        var item = findSchedule(activeScheduleNo);
        var errors = validatePriceValues(false);
        if (errors.length) {
          showPriceWarning(errors);
          toast('价格低于供应商口径，不能保存');
          return;
        }
        applyPriceValues(item);
        if (item.priceStatus === '待定价' && activePriceItems(item).some(function (priceItem) { return priceItem.sale != null && priceItem.sale > 0; })) item.priceStatus = '待提交';
        item.logs.unshift(['2026-07-14 10:30', '代理运营保存' + currentArrangementName() + '定价草稿。']);
        closeLayer(priceDrawer);
        renderRows();
        toast('定价草稿已保存');
      });
      document.getElementById('submitSchedulePriceReview').addEventListener('click', function () {
        var item = findSchedule(activeScheduleNo);
        var errors = validatePriceValues(true);
        if (errors.length) {
          showPriceWarning(errors);
          toast('请先修正价格后再提交');
          return;
        }
        applyPriceValues(item);
        item.priceStatus = '审核中';
        item.status = '待开售';
        item.logs.unshift(['2026-07-14 10:32', '代理运营提交' + currentArrangementName() + '定价审核。']);
        closeLayer(priceDrawer);
        renderRows();
        toast('定价已提交审核');
      });
      document.getElementById('confirmStopSchedule').addEventListener('click', function () {
        var item = findSchedule(activeScheduleNo);
        item.status = '停售';
        item.logs.unshift(['2026-07-14 10:35', '代理运营停售' + currentArrangementName() + '。']);
        closeLayer(stopScheduleModal);
        renderRows();
        toast('安排已停售');
      });

      renderSummary();
      renderRoutes();
      renderRows();
    })();
  </script>
</body>
</html>
