<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>代理产品工作台 - 凯撒旅游</title>
  <link rel="stylesheet" href="../../shared/style.css">
</head>
<body>
  <script src="../../shared/nav-merchant.js"></script>

  <section class="list-page-panel outsource-product-page">
    <div class="list-page-head">
      <div>
        <h1 class="page-title">代理产品工作台</h1>
      </div>
    </div>
  </section>

  <section class="list-surface product-outsource-list-list-surface" data-list-surface>
    <div class="list-surface-tabs list-function-tabs outsource-status-tabs" role="tablist" aria-label="代理产品开售状态">
      <button class="tab-item active" type="button" data-status-tab="" aria-selected="true"><span class="list-tab-label">全部</span></button>
      <button class="tab-item" type="button" data-status-tab="待开售" aria-selected="false"><span class="list-tab-label">待开售</span></button>
      <button class="tab-item" type="button" data-status-tab="审核中" aria-selected="false"><span class="list-tab-label">审核中</span></button>
      <button class="tab-item" type="button" data-status-tab="销售中" aria-selected="false"><span class="list-tab-label">销售中</span></button>
      <button class="tab-item" type="button" data-status-tab="已停售" aria-selected="false"><span class="list-tab-label">已停售</span></button>
    </div>
    <section class="filter-card filter-card-compact outsource-filter list-surface-filter" aria-label="代理产品筛选">
      <div class="filter-row">
        <div class="filter-item">
          <label class="sr-only" for="outsourceKeyword">代理产品</label>
          <input id="outsourceKeyword" type="search" placeholder="代理产品/供应商/目的地">
        </div>
        <div class="filter-item-sm">
          <label class="sr-only" for="outsourceType">产品类型</label>
          <select id="outsourceType">
            <option value="">全部类型</option>
            <option>参团游</option>
            <option>邮轮</option>
            <option>专列</option>
            <option>自由行</option>
          </select>
        </div>
        <div class="filter-item-sm">
          <label class="sr-only" for="outsourceOwner">负责人</label>
          <select id="outsourceOwner">
            <option value="">全部负责人</option>
            <option>陈琳</option>
            <option>周婷</option>
            <option>陈红</option>
          </select>
        </div>
        <div class="filter-actions outsource-filter-actions">
          <button id="filterOutsource" class="btn btn-secondary btn-filter-search" type="button">搜索</button>
          <button id="resetOutsourceFilters" class="btn btn-secondary" type="button">重置</button>
        </div>
      </div>
    </section>

    <section class="table-wrap outsource-table outsource-ops-table list-surface-table list-table-with-pagination" aria-label="代理产品列表">
      <table>
        <thead>
          <tr>
            <th>代理产品</th>
            <th>供应来源</th>
            <th>包装状态</th>
            <th>定价进度</th>
            <th>可售安排</th>
            <th>库存承接</th>
            <th>负责人</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="outsourceRows"></tbody>
      </table>
    </section>
    <div class="pagination list-surface-pagination list-pagination-attached">
      <span id="outsourcePagination">0条</span>
    </div>
  </section>

  <div id="ownerDrawer" class="modal-overlay drawer-overlay" aria-hidden="true">
    <div class="modal drawer-modal outsource-product-modal" role="dialog" aria-modal="true" aria-labelledby="ownerDrawerTitle">
      <div class="modal-header">
        <div id="ownerDrawerTitle" class="modal-title">更新负责人</div>
        <button class="modal-close" type="button" data-close-owner aria-label="关闭">×</button>
      </div>
      <div class="modal-body">
        <section class="drawer-section">
          <div class="drawer-section-head">
            <h3 class="drawer-section-title">代理产品</h3>
          </div>
          <div id="ownerProductSummary" class="description-grid"></div>
        </section>
        <section class="drawer-section">
          <div class="drawer-section-head">
            <h3 class="drawer-section-title">负责人</h3>
          </div>
          <div class="form-grid form-grid-2">
            <div class="form-group"><label class="form-label" for="currentOwner">当前负责人</label><input id="currentOwner" class="form-control" type="text" readonly></div>
            <div class="form-group"><label class="form-label" for="nextOwner">新负责人</label><select id="nextOwner" class="form-control"><option>陈琳</option><option>周婷</option><option>陈红</option><option>李哲</option></select></div>
            <div class="form-group form-group-full"><label class="form-label" for="ownerRemark">交接备注</label><textarea id="ownerRemark" class="form-control" rows="3"></textarea></div>
          </div>
        </section>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" type="button" data-close-owner>取消</button>
        <button id="saveOwner" class="btn btn-primary" type="button">确认更新</button>
      </div>
    </div>
  </div>

  <div id="stopProductModal" class="modal-overlay" aria-hidden="true">
    <div class="modal modal-sm modal-confirm outsource-stop-modal" role="dialog" aria-modal="true" aria-labelledby="stopProductTitle">
      <div class="modal-header">
        <div id="stopProductTitle" class="modal-title">停售</div>
        <button class="modal-close" type="button" data-close-stop aria-label="关闭">×</button>
      </div>
      <div class="modal-body">
        <div id="stopProductSummary" class="outsource-stop-summary"></div>
        <div class="form-group outsource-stop-reason"><label class="form-label" for="stopReason">停售原因</label><textarea id="stopReason" class="form-control" rows="3"></textarea></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" type="button" data-close-stop>取消</button>
        <button id="confirmStopProduct" class="btn btn-warning" type="button">确认停售</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var rows = document.getElementById('outsourceRows');
      var ownerDrawer = document.getElementById('ownerDrawer');
      var stopProductModal = document.getElementById('stopProductModal');
      var activeKey = '';
      var activeStatus = '';
      var products = [
        {
          key: 'group',
          name: '西欧精选8日散拼',
          type: '参团游',
          supplier: '欧洲联合地接社',
          sourceType: '第三方外采',
          departure: '北京',
          destination: '法国/德国/瑞士',
          routeCount: 2,
          arrangements: 3,
          scheduleObject: '团期',
          arrangementStatus: '2条线路 / 3个团期',
          quota: '总代理名额42人',
          packageStatus: '已包装',
          packageSub: '销售名称、行程和退改规则已维护',
          pricingProgress: '2个已生效 / 1个待定价',
          pricingSub: '无待审核团期',
          stockPolicy: '二次确认',
          stockSub: '下单前需供应商确认余位',
          scope: '门店+分销 / 华东直营',
          workStatus: '待开售',
          owner: '陈琳',
          detailHref: 'product-outsource-detail.html?type=group&source=OUT-EU-0001'
        },
        {
          key: 'jp',
          name: '日本本州经典8日',
          type: '参团游',
          supplier: '樱花旅游地接',
          sourceType: '第三方外采',
          departure: '广州',
          destination: '东京/大阪/京都',
          routeCount: 2,
          arrangements: 2,
          scheduleObject: '团期',
          arrangementStatus: '2条线路 / 2个团期',
          quota: '总代理名额26人',
          packageStatus: '待包装',
          packageSub: '需补销售名称、亮点、行程展示',
          pricingProgress: '0个已生效 / 2个待定价',
          pricingSub: '包装完成后进入团期定价',
          stockPolicy: '置零询位',
          stockSub: '先展示团期，确认余位后开售',
          scope: '门店销售 / 华南直营',
          workStatus: '待开售',
          owner: '陈琳',
          detailHref: 'product-outsource-detail.html?type=group&source=OUT-JP-0005'
        },
        {
          key: 'cruise',
          name: '理想号地中海邮轮舱房包销',
          type: '邮轮',
          supplier: '地中海旅游集团',
          sourceType: '集团外部船司',
          departure: '巴塞罗那母港',
          destination: '巴塞罗那/罗马/马赛',
          routeCount: 1,
          arrangements: 1,
          scheduleObject: '航次',
          arrangementStatus: '1条航线 / 1个航次',
          quota: '阳台舱18间',
          packageStatus: '已包装',
          packageSub: '舱型、费用包含和退改规则已维护',
          pricingProgress: '0个已生效 / 1个待审核',
          pricingSub: '开售审核已提交',
          stockPolicy: '舱位二次确认',
          stockSub: '供应商回传舱房后开放销售',
          scope: '门店+分销 / 邮轮销售组',
          workStatus: '审核中',
          owner: '周婷',
          detailHref: 'product-outsource-detail.html?type=cruise&source=OUT-CR-0006'
        },
        {
          key: 'free',
          name: '兰卡威机票酒店套餐',
          type: '自由行',
          supplier: '兰卡威酒店直采',
          sourceType: '酒店套餐外采',
          departure: '全国',
          destination: '兰卡威',
          routeCount: 1,
          arrangements: 1,
          scheduleObject: '出行日期',
          arrangementStatus: '1个套餐 / 1个出行日期',
          quota: '套餐名额30套',
          packageStatus: '已包装',
          packageSub: '套餐卖点、酒店图片和费用规则已维护',
          pricingProgress: '1个已生效 / 0个待审核',
          pricingSub: '定价已生效',
          stockPolicy: '每日房态回传',
          stockSub: '按供应商房态关闭销售',
          scope: '官网+小程序 / 全部门店',
          workStatus: '销售中',
          owner: '陈红',
          detailHref: 'product-outsource-detail.html?type=free&source=OUT-FT-0008'
        },
        {
          key: 'offline',
          name: '西葡经典10日散拼',
          type: '参团游',
          supplier: '布拉格优选旅游',
          sourceType: '第三方外采',
          departure: '北京',
          destination: '西班牙/葡萄牙',
          routeCount: 2,
          arrangements: 2,
          scheduleObject: '团期',
          arrangementStatus: '2条线路 / 2个团期',
          quota: '历史名额32人',
          packageStatus: '已包装',
          packageSub: '历史销售页保留',
          pricingProgress: '2个已生效 / 历史停售',
          pricingSub: '历史订单保留',
          stockPolicy: '关闭销售',
          stockSub: '仅保留历史订单履约',
          scope: '门店销售 / 历史订单保留',
          workStatus: '已停售',
          owner: '陈琳',
          detailHref: 'product-outsource-detail.html?type=group&source=OUT-EU-0012'
        }
      ];

      function escapeHtml(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, function (char) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char];
        });
      }

      function toast(message) {
        if (window.caesarUI && window.caesarUI.toast) window.caesarUI.toast(message);
      }

      function openLayer(modal) {
        if (window.caesarUI && window.caesarUI.openLayer) window.caesarUI.openLayer(modal);
        modal.classList.add('show');
        modal.setAttribute('aria-hidden', 'false');
      }

      function closeLayer(modal) {
        if (window.caesarUI && window.caesarUI.closeLayer) window.caesarUI.closeLayer(modal);
        else modal.classList.remove('show');
        modal.setAttribute('aria-hidden', 'true');
      }

      function tagClass(status) {
        if (status === '销售中' || status === '已包装') return 'tag tag-green';
        if (status === '待开售' || status === '待包装' || status === '待定价') return 'tag tag-blue';
        if (status === '审核中') return 'tag tag-orange';
        if (status === '已停售' || status === '关闭销售') return 'tag tag-gray';
        return 'tag tag-gray';
      }

      function scheduleHref(item) {
        return 'product-outsource-schedules.html?source=' + encodeURIComponent(sourceFromDetail(item));
      }

      function packageHref(item) {
        return 'product-outsource-package.html?source=' + encodeURIComponent(sourceFromDetail(item));
      }

      function approvalHref(item) {
        var isCruise = item.key === 'cruise';
        var approvalNo = isCruise ? 'APR-20260706-072' : 'APR-20260714-081';
        var kind = isCruise ? 'outsource_online' : 'outsource_price';
        return '../approval/approval-product-review.html?approvalNo=' + encodeURIComponent(approvalNo) + '&kind=' + encodeURIComponent(kind) + '&product=' + encodeURIComponent(item.key) + '&source=' + encodeURIComponent(sourceFromDetail(item));
      }

      function sourceFromDetail(item) {
        var match = String(item.detailHref || '').match(/[?&]source=([^&]+)/);
        return match ? decodeURIComponent(match[1]) : item.key;
      }

      function productText(item) {
        return [
          item.name,
          item.supplier,
          item.type,
          item.departure,
          item.destination,
          item.sourceType,
          item.packageStatus,
          item.pricingProgress,
          item.stockPolicy,
          item.workStatus,
          item.owner
        ].join(' ').toLowerCase();
      }

      function filteredProducts() {
        var keyword = document.getElementById('outsourceKeyword').value.trim().toLowerCase();
        var type = document.getElementById('outsourceType').value;
        var owner = document.getElementById('outsourceOwner').value;
        return products.filter(function (item) {
          if (keyword && productText(item).indexOf(keyword) < 0) return false;
          if (type && item.type !== type) return false;
          if (activeStatus && item.workStatus !== activeStatus) return false;
          if (owner && item.owner !== owner) return false;
          return true;
        });
      }

      function actionHtml(item) {
        var main = [
          '<a class="table-action-primary" href="' + escapeHtml(scheduleHref(item)) + '">定价</a>',
          '<a href="' + escapeHtml(packageHref(item)) + '">包装</a>'
        ];
        var menu = [
          '<a class="dropdown-item" href="' + escapeHtml(item.detailHref) + '">详情</a>',
          '<button class="dropdown-item" type="button" data-open-owner data-key="' + escapeHtml(item.key) + '">负责人</button>'
        ];
        if (item.workStatus === '待开售') {
          menu.unshift('<button class="dropdown-item" type="button" data-submit-online data-key="' + escapeHtml(item.key) + '">提交审核</button>');
        } else if (item.workStatus === '审核中') {
          menu.unshift('<a class="dropdown-item" href="' + escapeHtml(approvalHref(item)) + '">查看审核</a>');
        } else if (item.workStatus === '销售中') {
          menu.unshift('<button class="dropdown-item" type="button" data-open-stop data-key="' + escapeHtml(item.key) + '">停售</button>');
        } else if (item.workStatus === '已停售') {
          menu.unshift('<button class="dropdown-item" type="button" data-restore-product data-key="' + escapeHtml(item.key) + '">恢复</button>');
        }
        return main.join('') + '<span class="dropdown table-action-more"><button class="muted table-more-toggle" type="button" data-row-more aria-expanded="false">更多</button><span class="dropdown-menu action-dropdown-menu">' + menu.join('') + '</span></span>';
      }

      function renderRows() {
        var list = filteredProducts();
        rows.innerHTML = list.map(function (item) {
          return [
            '<tr data-key="' + escapeHtml(item.key) + '" data-status="' + escapeHtml(item.workStatus) + '">',
            '<td><div class="table-cell-main"><strong><a class="link-primary table-main-link" href="' + escapeHtml(item.detailHref) + '">' + escapeHtml(item.name) + '</a></strong><span>' + escapeHtml(item.type + ' · ' + item.departure + '/' + item.destination) + '</span><span class="' + tagClass(item.workStatus) + '">' + escapeHtml(item.workStatus) + '</span></div></td>',
            '<td><div class="table-cell-main"><strong>' + escapeHtml(item.supplier) + '</strong><span>' + escapeHtml(item.sourceType) + '</span></div></td>',
            '<td><div class="table-cell-main"><strong><span class="' + tagClass(item.packageStatus) + '">' + escapeHtml(item.packageStatus) + '</span></strong><span>' + escapeHtml(item.packageSub) + '</span></div></td>',
            '<td><div class="table-cell-main"><strong>' + escapeHtml(item.pricingProgress) + '</strong><span>' + escapeHtml(item.pricingSub) + '</span></div></td>',
            '<td><div class="table-cell-main"><strong><span class="count-link-line"><a class="count-link-number" href="' + escapeHtml(scheduleHref(item)) + '">' + escapeHtml(item.arrangements) + '</a>' + escapeHtml('个' + item.scheduleObject) + '</span></strong><span>' + escapeHtml(item.arrangementStatus + ' · ' + item.quota) + '</span></div></td>',
            '<td><div class="table-cell-main"><strong>' + escapeHtml(item.stockPolicy) + '</strong><span>' + escapeHtml(item.stockSub) + '</span></div></td>',
            '<td><strong>' + escapeHtml(item.owner) + '</strong></td>',
            '<td><div class="table-action">' + actionHtml(item) + '</div></td>',
            '</tr>'
          ].join('');
        }).join('');
        if (!list.length) {
          rows.innerHTML = '<tr><td colspan="8" class="text-muted">暂无符合条件的代理产品</td></tr>';
        }
        document.getElementById('outsourcePagination').textContent = '第1-' + list.length + '条/共' + products.length + '条';
      }

      function setActiveStatus(status) {
        activeStatus = status || '';
        document.querySelectorAll('[data-status-tab]').forEach(function (button) {
          var matched = (button.dataset.statusTab || '') === activeStatus;
          button.classList.toggle('active', matched);
          button.setAttribute('aria-selected', matched ? 'true' : 'false');
        });
        renderRows();
      }

      function findProduct(key) {
        return products.find(function (item) { return item.key === key; }) || products[0];
      }

      function description(items) {
        return items.map(function (item) {
          return '<div class="description-item"><div class="description-label">' + escapeHtml(item[0]) + '</div><div class="description-value">' + item[1] + '</div></div>';
        }).join('');
      }

      function productSummary(item) {
        return description([
          ['代理产品', escapeHtml(item.name)],
          ['来源供应商', escapeHtml(item.supplier)],
          ['代理安排', escapeHtml(item.arrangements + '个' + item.scheduleObject + ' / ' + item.quota)],
          ['开售状态', '<span class="' + tagClass(item.workStatus) + '">' + escapeHtml(item.workStatus) + '</span>']
        ]);
      }

      function stopProductSummary(item) {
        return [
          '<div class="outsource-stop-object">',
          '<strong>' + escapeHtml(item.name) + '</strong>',
          '<span>' + escapeHtml(item.supplier + ' · ' + item.departure + ' / ' + item.destination) + '</span>',
          '</div>',
          '<div class="outsource-stop-metrics">',
          '<div><span>开售状态</span><strong><span class="' + tagClass(item.workStatus) + '">' + escapeHtml(item.workStatus) + '</span></strong></div>',
          '<div><span>代理安排</span><strong>' + escapeHtml(item.arrangements + '个' + item.scheduleObject) + '</strong></div>',
          '<div><span>定价进度</span><strong>' + escapeHtml(item.pricingProgress) + '</strong></div>',
          '<div><span>负责人</span><strong>' + escapeHtml(item.owner) + '</strong></div>',
          '</div>'
        ].join('');
      }

      function openOwner(key) {
        var item = findProduct(key);
        activeKey = item.key;
        document.getElementById('ownerProductSummary').innerHTML = productSummary(item);
        document.getElementById('currentOwner').value = item.owner;
        document.getElementById('nextOwner').value = item.owner;
        document.getElementById('ownerRemark').value = '';
        openLayer(ownerDrawer);
      }

      function openStop(key) {
        var item = findProduct(key);
        activeKey = item.key;
        document.getElementById('stopProductSummary').innerHTML = stopProductSummary(item);
        document.getElementById('stopReason').value = '';
        openLayer(stopProductModal);
      }

      document.getElementById('filterOutsource').addEventListener('click', renderRows);
      ['outsourceKeyword', 'outsourceType', 'outsourceOwner'].forEach(function (id) {
        document.getElementById(id).addEventListener('change', function () {
          renderRows();
        });
      });
      document.getElementById('outsourceKeyword').addEventListener('keydown', function (event) {
        if (event.key === 'Enter') renderRows();
      });
      document.getElementById('resetOutsourceFilters').addEventListener('click', function () {
        document.querySelectorAll('.outsource-filter input').forEach(function (input) { input.value = ''; });
        document.querySelectorAll('.outsource-filter select').forEach(function (select) { select.value = ''; });
        setActiveStatus('');
      });
      document.querySelectorAll('[data-status-tab]').forEach(function (button) {
        button.addEventListener('click', function () {
          setActiveStatus(button.dataset.statusTab || '');
        });
      });
      document.addEventListener('click', function (event) {
        if (event.target.closest('[data-close-owner]')) closeLayer(ownerDrawer);
        if (event.target.closest('[data-close-stop]')) closeLayer(stopProductModal);
        var ownerButton = event.target.closest('[data-open-owner]');
        if (ownerButton) openOwner(ownerButton.dataset.key);
        var stopButton = event.target.closest('[data-open-stop]');
        if (stopButton) openStop(stopButton.dataset.key);
        var submitOnlineButton = event.target.closest('[data-submit-online]');
        if (submitOnlineButton) {
          var submitItem = findProduct(submitOnlineButton.dataset.key);
          submitItem.workStatus = '审核中';
          renderRows();
          toast('开售审核已提交');
        }
        var restoreButton = event.target.closest('[data-restore-product]');
        if (restoreButton) {
          findProduct(restoreButton.dataset.key).workStatus = '待开售';
          renderRows();
          toast('已恢复到待开售');
        }
        if (event.target.classList.contains('modal-overlay')) closeLayer(event.target);
      });
      document.getElementById('saveOwner').addEventListener('click', function () {
        var item = findProduct(activeKey);
        item.owner = document.getElementById('nextOwner').value || item.owner;
        closeLayer(ownerDrawer);
        renderRows();
        toast('负责人已更新');
      });
      document.getElementById('confirmStopProduct').addEventListener('click', function () {
        findProduct(activeKey).workStatus = '已停售';
        closeLayer(stopProductModal);
        renderRows();
        toast('产品已停售');
      });

      renderRows();
    })();
  </script>
